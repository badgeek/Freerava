<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ride Viewer</title>
<!--
  Standalone Three.js viewer for a cyclomp ride export. Drag a .geojson
  produced by the app's EXPORT button onto the window (or click to pick one).
  Clean light theme: the route is drawn in 3D with elevation as height and an
  "elevation curtain" down to the ground; colour encodes speed on a single-hue
  orange ramp (slow = light, fast = deep). Fly-through reveal, chase cam,
  scrub timeline, stat row. No build step; serve this folder and open it
  (needs internet once for the Three.js CDN).
-->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      ink: '#242428', muted: '#6d6d78', faint: '#9a9aa5', bd: '#e6e6eb',
      card: '#ffffff', canvas: '#f5f6f8', accent: '#fc5200', accentd: '#d94700',
      start: '#16a34a', finish: '#dc2626',
    },
    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"',
      'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'] },
    boxShadow: { card: '0 1px 3px rgba(20,20,30,.08), 0 4px 16px rgba(20,20,30,.08)' },
  } } };
</script>
<style type="text/tailwindcss">
  /* Only what utility classes can't express statically: gradients, the range
     accent, and the JS-toggled .on / .hide / .dragging states. */
  canvas { display: block; }
  .hide { display: none !important; }
  #vignette { background: radial-gradient(ellipse 75% 65% at 50% 42%,
    rgba(0,0,0,0) 55%, rgba(28,32,44,.055) 78%, rgba(28,32,44,.13) 100%); }
  #legendbar { background: linear-gradient(90deg, #fcd0ae, #fc5200, #8f2d00); }
  #scrub, #exag { accent-color: #fc5200; height: 4px; cursor: pointer; }
  #viewmodes button.on, .pill.on { background: #fc5200; border-color: #fc5200; color: #fff; }
  body.dragging #dropwell { border-color: #fc5200; background: #fff7f2; }
</style>
</head>
<body class="h-full m-0 overflow-hidden font-sans text-ink bg-canvas">
<div id="app" class="fixed inset-0"></div>
<div id="vignette" class="fixed inset-0 pointer-events-none z-[1]"></div>

<header id="header" style="display:none"
  class="fixed top-0 inset-x-0 z-[3] bg-white/80 backdrop-blur-md backdrop-saturate-150
         border-b border-bd shadow-[0_6px_20px_rgba(20,20,30,.05)]">
  <div class="max-w-[1160px] mx-auto px-6 py-3 flex items-center justify-between gap-6 flex-wrap">
    <div class="flex items-center gap-3 min-w-0">
      <span class="w-[5px] h-[30px] rounded-[3px] shrink-0 bg-gradient-to-b from-accent to-accentd"></span>
      <div>
        <h1 class="text-base font-bold tracking-tight leading-tight m-0">Ride Viewer</h1>
        <span id="date" class="block text-muted text-xs mt-px tabular-nums"></span>
      </div>
    </div>
    <div class="flex items-stretch">
      <div class="px-5 py-0.5">
        <div class="text-[23px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap text-accent"><span id="s-dist">0.0</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">km</i></div>
        <div class="text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold">Distance</div>
      </div>
      <div class="px-5 py-0.5 border-l border-bd">
        <div class="text-[23px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-time">0:00</span></div>
        <div class="text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold">Moving Time</div>
      </div>
      <div class="px-5 py-0.5 border-l border-bd">
        <div class="text-[23px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-avg">0</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">km/h</i></div>
        <div class="text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold">Avg Speed</div>
      </div>
      <div class="px-5 py-0.5 border-l border-bd">
        <div class="text-[23px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-max">0</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">km/h</i></div>
        <div class="text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold">Max Speed</div>
      </div>
      <div class="px-5 py-0.5 border-l border-bd">
        <div class="text-[23px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-elev">0</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">m</i></div>
        <div class="text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold">Elev Gain</div>
      </div>
      <div class="px-5 py-0.5 border-l border-bd">
        <div class="text-[23px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-hr">--</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">bpm</i></div>
        <div class="text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold">Avg HR</div>
      </div>
    </div>
  </div>
</header>

<div id="legend" style="display:none"
  class="fixed left-6 bottom-[104px] z-[3] w-[200px] bg-card border border-bd rounded-[10px] shadow-card px-[14px] py-[10px]">
  <div class="text-[11px] text-muted uppercase tracking-wide mb-1.5">Speed</div>
  <div id="legendbar" class="h-2 rounded"></div>
  <div class="flex justify-between text-muted text-[11px] mt-1 tabular-nums">
    <span id="lg-min">0</span><span>km/h</span><span id="lg-max">0</span></div>
</div>

<div id="viewmodes" style="display:none"
  class="fixed top-[70px] left-1/2 -translate-x-1/2 z-[3] flex items-center bg-card border border-bd rounded-full shadow-card p-[3px] gap-[2px]">
  <button data-mode="map" class="on text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Map</button>
  <button data-mode="hybrid" class="text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Map&nbsp;+&nbsp;Elev</button>
  <button data-mode="grid" class="text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Grid</button>
  <button data-mode="template" class="text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Elevation</button>
  <button data-mode="progress" class="text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Progress</button>
</div>

<div id="hint" style="display:none"
  class="fixed right-6 bottom-[104px] z-[3] bg-card border border-bd rounded-[10px] shadow-card text-muted text-[11.5px] px-3 py-2">Drag to orbit &nbsp;·&nbsp; scroll to zoom</div>
<div id="attrib" style="display:none"
  class="fixed right-6 bottom-[74px] z-[3] bg-white/85 border border-bd rounded-md text-faint text-[10px] px-2 py-[3px] [&_a]:text-muted [&_a]:no-underline"></div>

<div id="transport" style="display:none"
  class="fixed left-1/2 -translate-x-1/2 bottom-6 z-[3] w-[min(720px,calc(100%-48px))]
         flex items-center gap-[14px] bg-card border border-bd rounded-full shadow-card pl-[10px] pr-[18px] py-[10px]">
  <button id="play" aria-label="Play"
    class="w-11 h-11 shrink-0 rounded-full bg-accent hover:bg-accentd text-white text-[15px]
           grid place-items-center transition-colors">&#9654;</button>
  <input id="scrub" type="range" min="0" max="1000" value="1000" class="flex-1" />
  <span id="clock" class="text-ink text-sm font-semibold min-w-[52px] text-right tabular-nums">0:00</span>
  <button id="follow"
    class="pill text-[12.5px] font-semibold text-muted border border-bd rounded-full px-[13px] py-[7px]
           whitespace-nowrap transition hover:border-faint hover:text-ink">Chase cam</button>
  <span id="reliefctl" class="flex items-center gap-[7px] text-muted text-[11.5px] font-semibold uppercase tracking-wide whitespace-nowrap">
    Relief <input id="exag" type="range" min="0" max="40" value="12" class="w-20" /></span>
</div>

<div id="drop"
  class="fixed inset-0 z-[5] flex items-center justify-center bg-canvas/95 cursor-pointer">
  <div class="bg-card border border-bd rounded-2xl shadow-card px-14 py-11 text-center max-w-[460px]">
    <div id="dropwell" class="border-2 border-dashed border-bd rounded-xl px-7 py-8 transition">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        class="w-11 h-11 stroke-accent mb-2.5 mx-auto">
        <path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
      </svg>
      <div class="text-[19px] font-bold tracking-tight">Upload your ride</div>
      <div class="text-muted text-[13.5px] leading-relaxed mt-2">Drop the
        <code class="bg-canvas border border-bd rounded px-1.5 text-xs">.geojson</code> here, or click to browse.<br/>
        Export one from cyclomp: <strong>Log&nbsp;→ open a ride&nbsp;→ Export</strong>.</div>
      <div id="err" class="text-finish text-[13px] min-h-[18px] mt-2.5 font-medium"></div>
    </div>
  </div>
  <input id="file" type="file" accept=".geojson,.json,application/geo+json" class="hidden" />
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const COL = {
  bg: 0xeef0f3, grid: 0xd7dce2, grid2: 0xe4e8ed,
  rampLo: 0xfcd0ae, accent: 0xfc5200, rampHi: 0x8f2d00,
  start: 0x16a34a, finish: 0xdc2626, white: 0xffffff,
};

// ---- scene ----
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
app.appendChild(renderer.domElement);
// Safety net: MapLibre adds a second WebGL context, and a stressed browser
// can drop ours. Ask for it back rather than going blank.
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  setTimeout(() => renderer.forceContextRestore(), 200);
}, false);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.bg);
// Range is set from the ride's own size in frameCamera() — fixed distances
// fogged a multi-kilometre ride out completely.
scene.fog = new THREE.Fog(0xf2f4f7, 1e6, 2e6); // matched to the horizon band

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 20000);
camera.position.set(300, 320, 480);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495; // stay above the ground
// Refresh the map detail LOD after the user stops dragging/zooming.
controls.addEventListener('end', () => scheduleDetail());

// Ground grid.
const grid = new THREE.GridHelper(4000, 80, COL.grid, COL.grid2);
grid.material.transparent = true; grid.material.opacity = 0.9;
scene.add(grid);

// No lights anywhere: every material is unlit (MeshBasicMaterial), and the
// terrain's relief shading is baked into vertex colours (see refreshTerrain).
// That keeps the draped map at its true colours and sidesteps three's
// r155+ physical-light-units migration entirely.

// ---- backdrop: a soft studio gradient dome ----
// An inverted sphere pinned to the camera, so it can never be clipped by the
// far plane or orbited "out of". fog: false keeps the haze off the sky
// itself; its scale is set from the ride's size in frameCamera().
function skyTexture() {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const x = c.getContext('2d');
  const grad = x.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.00, '#d3dcea'); // zenith, cool
  grad.addColorStop(0.42, '#e7ecf3');
  grad.addColorStop(0.60, '#f7f8fa'); // horizon glow
  grad.addColorStop(0.78, '#e9ebef');
  grad.addColorStop(1.00, '#dcdfe5'); // below the horizon
  x.fillStyle = grad; x.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1, 32, 20),
  new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide,
                                fog: false, depthWrite: false }));
sky.renderOrder = -1;
sky.scale.setScalar(5000);
scene.add(sky);

// Soft contact shadow under the block — it reads as a solid object sitting
// in a space instead of a slab hanging in a void. The camera is clamped
// above the horizon (maxPolarAngle), so it is never seen from underneath.
function shadowTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  // Tighter core than a plain radial falloff: mostly solid under the block,
  // then a quick soft edge, so it reads as contact rather than a grey haze.
  const grad = x.createRadialGradient(s / 2, s / 2, s * 0.05, s / 2, s / 2, s / 2);
  grad.addColorStop(0.00, 'rgba(22,27,40,0.55)');
  grad.addColorStop(0.38, 'rgba(22,27,40,0.40)');
  grad.addColorStop(0.62, 'rgba(22,27,40,0.16)');
  grad.addColorStop(0.82, 'rgba(22,27,40,0.04)');
  grad.addColorStop(1.00, 'rgba(22,27,40,0)');
  x.fillStyle = grad; x.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
let _shadowTex = null;
const shadowTex = () => _shadowTex || (_shadowTex = shadowTexture());

// Technical grid the specimen is presented on: fine cells with a heavier
// line every eighth, faded out radially so the plane has no visible edge.
// The falloff is baked into the texture's alpha (destination-in), which
// avoids a second transparent mask plane.
function gridTexture() {
  const s = 1024, cells = 32, step = s / cells;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const line = (every, style, width) => {
    x.strokeStyle = style; x.lineWidth = width;
    x.beginPath();
    for (let i = 0; i <= cells; i += every) {
      const p = Math.round(i * step) + 0.5;
      x.moveTo(p, 0); x.lineTo(p, s);
      x.moveTo(0, p); x.lineTo(s, p);
    }
    x.stroke();
  };
  line(1, 'rgba(120,134,158,0.18)', 1);  // minor
  line(8, 'rgba(92,108,134,0.34)', 2);   // major
  const fade = x.createRadialGradient(s / 2, s / 2, s * 0.08, s / 2, s / 2, s / 2);
  fade.addColorStop(0.00, 'rgba(0,0,0,0.85)');
  fade.addColorStop(0.50, 'rgba(0,0,0,0.55)');
  fade.addColorStop(0.82, 'rgba(0,0,0,0.12)');
  fade.addColorStop(1.00, 'rgba(0,0,0,0)');
  x.globalCompositeOperation = 'destination-in';
  x.fillStyle = fade; x.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
let _gridTex = null;
const gridTex = () => _gridTex || (_gridTex = gridTexture());

// ---- ride state ----
let ride = null;
let playing = false, headT = 1, follow = false, exag = 12;

function disposeObj(o) {
  if (!o) return;
  scene.remove(o);
  o.geometry?.dispose?.(); o.material?.dispose?.();
  o.children?.slice().forEach(disposeObj);
}
function clearRide() {
  if (!ride) return;
  for (const o of [ride.route, ride.curtain, ride.head, ride.startDot,
                   ride.endDot, ride.terrain, ride.wire, ride.skirt, ride.cap,
                   ride.shadow, ride.base, ride.detail, ride.slab])
    disposeObj(o);
  grid.visible = true;
  document.getElementById('attrib').style.display = 'none';
  viewMode = 'map'; // each new ride opens in Map view
  ride = null;
}

// Single-hue orange ramp: slow = light, fast = deep.
const c1 = new THREE.Color(COL.rampLo), c2 = new THREE.Color(COL.accent),
      c3 = new THREE.Color(COL.rampHi);
function speedColor(v, out) {
  if (v < 0.5) out.copy(c1).lerp(c2, v / 0.5);
  else out.copy(c2).lerp(c3, (v - 0.5) / 0.5);
  return out;
}

function project(coords) {
  // Equirectangular metres around the centroid; north = -Z, up = +Y.
  // Returns the projection constants too — the map slab reuses them.
  let lat0 = 0, lon0 = 0;
  for (const c of coords) { lon0 += c[0]; lat0 += c[1]; }
  lon0 /= coords.length; lat0 /= coords.length;
  const kx = Math.cos(lat0 * Math.PI / 180) * 111320, kz = 110540;
  let altMin = Infinity;
  for (const c of coords) altMin = Math.min(altMin, c[2] ?? 0);
  const pts = coords.map(c => new THREE.Vector3(
    (c[0] - lon0) * kx, ((c[2] ?? 0) - altMin), -(c[1] - lat0) * kz));
  return { pts, lat0, lon0, kx, kz };
}

// Start / finish: a little flag on a pole (finish gets a checker texture).
function makeFlag(color, checkered = false) {
  const gp = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 24, 8),
    new THREE.MeshBasicMaterial({ color: 0x6b6b74 }));
  pole.position.y = 12;
  gp.add(pole);
  let mat;
  if (checkered) {
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const x = c.getContext('2d');
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      x.fillStyle = (i + j) % 2 ? '#17171b' : '#ffffff';
      x.fillRect(i * 8, j * 8, 8, 8);
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide });
  } else {
    mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  }
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(13, 8), mat);
  flag.position.set(6.9, 19.5, 0);
  gp.add(flag);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 1.6, 10),
    new THREE.MeshBasicMaterial({ color: 0x55555e }));
  base.position.y = 0.8;
  gp.add(base);
  scene.add(gp);
  return gp;
}

// Current position: a low-poly bike built from primitives, facing +X.
function makeBike() {
  const g = new THREE.Group();
  // Unlit, so tubes get slightly different tones to keep the form readable.
  const frame = new THREE.MeshBasicMaterial({ color: COL.accent });
  const frameLo = new THREE.MeshBasicMaterial({ color: 0xc43f00 });
  const dark = new THREE.MeshBasicMaterial({ color: 0x2b2b31 });
  const wheelG = new THREE.TorusGeometry(4, 0.8, 6, 14);
  const w1 = new THREE.Mesh(wheelG, dark); w1.position.set(-5.5, 4, 0); g.add(w1);
  const w2 = new THREE.Mesh(wheelG, dark); w2.position.set(5.5, 4, 0); g.add(w2);
  const tube = (ax, ay, bx, by, mat, r = 0.7) => {
    const a = new THREE.Vector3(ax, ay, 0), b = new THREE.Vector3(bx, by, 0);
    const d = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 6), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
    g.add(m);
  };
  tube(-5.5, 4, -1.2, 9.2, frameLo); // seat stay
  tube(-5.5, 4, 1.5, 3.6, frameLo);  // chain stay
  tube(1.5, 3.6, -1.2, 9.2, frame);  // seat tube
  tube(1.5, 3.6, 4.6, 9.2, frame);   // down tube
  tube(-1.2, 9.2, 4.6, 9.2, frame);  // top tube
  tube(4.6, 9.2, 5.5, 4, frameLo);   // fork
  const saddle = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.9, 1.5), dark);
  saddle.position.set(-1.6, 10, 0); g.add(saddle);
  const bars = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 5.2), dark);
  bars.position.set(4.6, 10, 0); g.add(bars);
  scene.add(g);
  return g;
}

function buildRide(gj) {
  clearRide();
  const feat = (gj.features || []).find(f => f.geometry?.type === 'LineString');
  if (!feat) throw new Error('no LineString feature in this GeoJSON');
  const coords = feat.geometry.coordinates;
  if (coords.length < 2) throw new Error('track has fewer than 2 points');
  const speed = feat.properties?.speed_kmh || coords.map(() => 0);
  const tArr = feat.properties?.t_s || coords.map((_, i) => i);

  const proj = project(coords);
  const P = proj.pts;
  const vMax = Math.max(1e-3, ...speed), vMin = Math.min(...speed);
  const vNorm = speed.map(s => (s - vMin) / Math.max(1e-3, vMax - vMin));
  const cumD = [0];
  for (let i = 1; i < P.length; i++) cumD.push(cumD[i - 1] + P[i].distanceTo(P[i - 1]));

  const g = { P, proj, coords, speed, tArr, vNorm, vMin, vMax, cumD,
              tMin: tArr[0], tMax: tArr[tArr.length - 1],
              summary: gj.properties || {} };
  ride = g;

  rebuildGeometry(); // positions depend on the relief slider

  // Markers scale with the ride's footprint so a city loop and an alpine
  // century both read correctly.
  const span = new THREE.Box3().setFromPoints(P).getSize(new THREE.Vector3());
  g.mScale = Math.min(30, Math.max(0.35, Math.max(span.x, span.z) / 260));
  g.startDot = makeFlag(COL.start);
  g.endDot = makeFlag(null, true); // checkered finish
  g.head = makeBike();
  for (const m of [g.startDot, g.endDot, g.head]) m.scale.setScalar(g.mScale);
  g.startDot.position.copy(g.drawn[0]);
  g.endDot.position.copy(g.drawn[g.drawn.length - 1]);

  frameCamera();
  headT = 1; setProgress(1);
  showChrome(g.summary, vMin, vMax);
  buildSlab(g); // async: the map diorama pops in when its tiles arrive
}

const ROUTE_LIFT = 2; // metres above the slab top, so the line never z-fights

function rebuildGeometry() {
  const g = ride; if (!g) return;
  // How the route is lifted:
  //  overGrid (Elevation/Progress): altitude ribbon over the bare grid,
  //    curtain to a flat y=0 baseline.
  //  overMap (Map+Elev): the same altitude ribbon but riding HIGH above the
  //    real terrain surface, curtain dropping back down to the terrain.
  //  else (Map/Grid): draped on the terrain relief.
  const overGrid = viewMode === 'template' || viewMode === 'progress';
  const overMap = viewMode === 'hybrid';
  const HYBRID_RIBBON = 2.4; // extra altitude gain for the floating ribbon
  const surfaceOf = p => (g.demSample ? g.demSample(p.x, p.z) * exagT() : 0);
  const pts = g.P.map(p => {
    let y;
    if (overMap) y = surfaceOf(p) + p.y * exag * HYBRID_RIBBON + 16;
    else if (overGrid) y = p.y * exag + 8;
    else y = surfaceOf(p);
    return new THREE.Vector3(p.x, y + ROUTE_LIFT, p.z);
  });
  g.drawn = pts;
  g.trackMode = overGrid || overMap; // curtain shown + reframing
  g.curtainToBaseline = overGrid;    // grid ribbon drops to 0; hybrid to terrain

  // Route line, per-vertex speed colour.
  const pos = new Float32Array(pts.length * 3);
  const col = new Float32Array(pts.length * 3);
  const tmp = new THREE.Color();
  for (let i = 0; i < pts.length; i++) {
    pos[i * 3] = pts[i].x; pos[i * 3 + 1] = pts[i].y; pos[i * 3 + 2] = pts[i].z;
    speedColor(g.vNorm[i], tmp);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  const geo = new LineGeometry();
  geo.setPositions(pos); geo.setColors(col);
  disposeObj(g.route);
  const mat = new LineMaterial({ vertexColors: true, linewidth: 5,
    worldUnits: false, transparent: true });
  mat.resolution.set(innerWidth, innerHeight);
  const line = new Line2(geo, mat);
  line.computeLineDistances();
  scene.add(line); g.route = line; g.mat = mat; g.segCount = pts.length - 1;

  // Elevation curtain: a translucent wall from the route down to the ground,
  // tinted by the same ramp — gives the flyover its sense of relief.
  const n = pts.length;
  const cPos = new Float32Array(n * 2 * 3);
  const cCol = new Float32Array(n * 2 * 3);
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    // Grid ribbon drops to a flat baseline; hybrid + draped views drop the
    // curtain to the terrain surface just under the line.
    const by = g.curtainToBaseline ? 0
             : g.demSample ? g.demSample(p.x, p.z) * exagT() : 0;
    cPos.set([p.x, p.y, p.z, p.x, by, p.z], i * 6);
    speedColor(g.vNorm[i], tmp);
    cCol.set([tmp.r, tmp.g, tmp.b, tmp.r, tmp.g, tmp.b], i * 6);
  }
  const idx = [];
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, b, c, b, d, c);
  }
  const cg = new THREE.BufferGeometry();
  cg.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
  cg.setAttribute('color', new THREE.BufferAttribute(cCol, 3));
  cg.setIndex(idx);
  disposeObj(g.curtain);
  const curtain = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: g.trackMode ? 0.26 : 0.14,
    side: THREE.DoubleSide, depthWrite: false }));
  scene.add(curtain); g.curtain = curtain;

  if (g.startDot) g.startDot.position.copy(pts[0]);
  if (g.endDot) g.endDot.position.copy(pts[pts.length - 1]);
  setProgress(headT);
}

// ---- Map diorama: a slab "cut out of the earth" under the route.
// Basemap raster tiles (CARTO Positron, CORS-enabled) are stitched onto a
// canvas, cropped to the padded ride bbox, and laid on top of a box whose
// sides wear a soil/rock gradient. Fails silently (grid stays) when offline.
const mercX = lon => (lon + 180) / 360;
const mercY = lat => {
  const s = Math.sin(lat * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
};
const loadImg = url => new Promise((res, rej) => {
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => res(im); im.onerror = () => rej(new Error('tile failed'));
  im.src = url;
});

// -- Basemap: MapLibre GL JS renders the bbox (OpenFreeMap "liberty" vector
// style, free/no key) into a hidden map; we copy its canvas out as the slab
// texture. Vector = crisp at any zoom and exact mercator, which fixes both
// the blurry-on-zoom look and the base/detail registration ghosting.
//
// The earlier context-loss ("WebGL context was lost" -> blank viewer) came
// from keeping a LIVE interactive MapLibre map around (a second, persistent
// GL context fighting Three's). Here there is exactly ONE hidden map, created
// once and REUSED for every render (never per-call churn), and renders are
// serialised through a queue. Two stable contexts coexist fine; if MapLibre
// still fails (offline/blocked) we fall back to the OSM raster stitch below.
let _mlPromise = null;
function loadMapLibre() {
  if (window.maplibregl) return Promise.resolve();
  if (!_mlPromise) _mlPromise = new Promise((res, rej) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('maplibre load failed'));
    document.head.appendChild(s);
  });
  return _mlPromise;
}

let _mlMap = null, _mlDiv = null, _mlQueue = Promise.resolve();
async function mlReady() {
  await loadMapLibre();
  if (_mlMap) return _mlMap;
  _mlDiv = document.createElement('div');
  _mlDiv.style.cssText = 'position:fixed;left:-20000px;top:0;width:1024px;height:1024px;';
  document.body.appendChild(_mlDiv);
  _mlMap = new maplibregl.Map({
    container: _mlDiv,
    style: 'https://tiles.openfreemap.org/styles/liberty',
    interactive: false, attributionControl: false,
    preserveDrawingBuffer: true, fadeDuration: 0, antialias: true,
  });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('maplibre init timeout')), 20000);
    _mlMap.once('load', () => { clearTimeout(to); res(); });
  });
  return _mlMap;
}

// Render a bbox flat (pitch 0) into a canvas ~maxPx on its long side, matched
// to the bbox's mercator aspect so it drapes edge-to-edge. Sets _mpp (metres
// per pixel) for LOD gating. Serialised — one render at a time on the shared map.
function mlRender(lonW, latS, lonE, latN, maxPx = 2048) {
  const run = async () => {
    const map = await mlReady();
    const mAspect = (mercX(lonE) - mercX(lonW)) / (mercY(latS) - mercY(latN));
    const cssW = mAspect >= 1 ? maxPx : Math.max(256, Math.round(maxPx * mAspect));
    const cssH = mAspect >= 1 ? Math.max(256, Math.round(maxPx / mAspect)) : maxPx;
    _mlDiv.style.width = cssW + 'px'; _mlDiv.style.height = cssH + 'px';
    map.resize();
    map.fitBounds([[lonW, latS], [lonE, latN]], { padding: 0, animate: false, duration: 0 });
    await new Promise((res, rej) => {
      const to = setTimeout(() => rej(new Error('maplibre render timeout')), 15000);
      map.once('idle', () => { clearTimeout(to); res(); });
    });
    const src = map.getCanvas();
    const out = document.createElement('canvas');
    out.width = src.width; out.height = src.height;
    const ctx = out.getContext('2d');
    ctx.filter = 'saturate(1.06) contrast(1.03)';
    ctx.drawImage(src, 0, 0);
    const kx = Math.cos(((latS + latN) / 2) * Math.PI / 180) * 111320;
    out._mpp = (lonE - lonW) * kx / out.width; // metres per output pixel
    return out;
  };
  const p = _mlQueue.then(run, run); // serialise regardless of prior outcome
  _mlQueue = p.catch(() => {});
  return p;
}

// -- Fallback basemap: stitch OSM standard raster tiles (free, no key) onto a
// 2D canvas (no GL context) and crop to the exact bbox. Used only when the
// MapLibre path above fails.
async function rasterStitch(lonW, latS, lonE, latN, maxPx = 4096, maxTiles = 80) {
  const TS = 256;
  // Highest zoom that still fits the texture / tile budget. (Capping the LONG
  // side matters for narrow out-and-back routes: a 616 x 3647 m strip would
  // otherwise drop to z16 and blur the streets.) A smaller bbox with the same
  // budget naturally lands on a higher zoom — that's how the detail LOD gets
  // its extra sharpness.
  let z = 3;
  for (let cand = 19; cand >= 3; cand--) {
    const w = (mercX(lonE) - mercX(lonW)) * (1 << cand) * TS;
    const h = (mercY(latS) - mercY(latN)) * (1 << cand) * TS;
    const tiles = (Math.floor(mercX(lonE) * (1 << cand)) - Math.floor(mercX(lonW) * (1 << cand)) + 1) *
                  (Math.floor(mercY(latS) * (1 << cand)) - Math.floor(mercY(latN) * (1 << cand)) + 1);
    if (Math.max(w, h) <= maxPx && tiles <= maxTiles) { z = cand; break; }
  }
  const n = 1 << z;
  const tx0 = Math.floor(mercX(lonW) * n), tx1 = Math.floor(mercX(lonE) * n);
  const ty0 = Math.floor(mercY(latN) * n), ty1 = Math.floor(mercY(latS) * n);
  const jobs = [];
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++)
      jobs.push(loadImg(`https://tile.openstreetmap.org/${z}/${tx}/${ty}.png`)
        .then(im => ({ im, tx, ty })));
  const tiles = await Promise.all(jobs);
  const stitched = document.createElement('canvas');
  stitched.width = (tx1 - tx0 + 1) * TS; stitched.height = (ty1 - ty0 + 1) * TS;
  const sc = stitched.getContext('2d');
  for (const t of tiles) sc.drawImage(t.im, (t.tx - tx0) * TS, (t.ty - ty0) * TS, TS, TS);
  const px = v => v * n * TS;
  const sx = px(mercX(lonW)) - tx0 * TS, sy = px(mercY(latN)) - ty0 * TS;
  const sw = px(mercX(lonE)) - px(mercX(lonW)), sh = px(mercY(latS)) - px(mercY(latN));
  const crop = document.createElement('canvas');
  crop.width = Math.max(2, Math.round(sw)); crop.height = Math.max(2, Math.round(sh));
  const ctx = crop.getContext('2d');
  // A touch of pop so the draped texture stays legible at a viewing angle.
  ctx.filter = 'saturate(1.1) contrast(1.06)';
  ctx.drawImage(stitched, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
  crop._zoom = z;
  return crop;
}

const OSM_LINK = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
const OFM_LINK = OSM_LINK + ' &middot; <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>';
async function mapCanvasForBbox(lonW, latS, lonE, latN, px = 3072) {
  try {
    const canvas = await mlRender(lonW, latS, lonE, latN, px);
    return { canvas, attrib: OFM_LINK };
  } catch {
    const canvas = await rasterStitch(lonW, latS, lonE, latN);
    canvas._mpp = null;
    return { canvas, attrib: OSM_LINK };
  }
}

let _earthTex = null;
function earthTex() { return _earthTex || (_earthTex = earthSideTexture()); }
function earthSideTexture() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 128;
  const x = c.getContext('2d');
  const grad = x.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0.00, '#d9c7a8'); // thin topsoil line under the map
  grad.addColorStop(0.06, '#b08a5f');
  grad.addColorStop(0.45, '#8a6647');
  grad.addColorStop(1.00, '#5d4531'); // bedrock
  x.fillStyle = grad; x.fillRect(0, 0, 4, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Terrarium raster-dem stitched + cropped to the bbox, decoded to metres and
// rebased to its lowest point (the slab's ground level).
async function fetchDem(lonW, latS, lonE, latN) {
  const TS = 256;
  let z = 3;
  for (let cand = 15; cand >= 3; cand--) {
    const w = (mercX(lonE) - mercX(lonW)) * (1 << cand) * TS;
    const h = (mercY(latS) - mercY(latN)) * (1 << cand) * TS;
    const tiles = (Math.floor(mercX(lonE) * (1 << cand)) - Math.floor(mercX(lonW) * (1 << cand)) + 1) *
                  (Math.floor(mercY(latS) * (1 << cand)) - Math.floor(mercY(latN) * (1 << cand)) + 1);
    if (Math.max(w, h) <= 320 && tiles <= 12) { z = cand; break; }
  }
  const n = 1 << z;
  const tx0 = Math.floor(mercX(lonW) * n), tx1 = Math.floor(mercX(lonE) * n);
  const ty0 = Math.floor(mercY(latN) * n), ty1 = Math.floor(mercY(latS) * n);
  const jobs = [];
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++)
      jobs.push(loadImg(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${tx}/${ty}.png`)
        .then(im => ({ im, tx, ty })));
  const tiles = await Promise.all(jobs);
  const stitched = document.createElement('canvas');
  stitched.width = (tx1 - tx0 + 1) * TS; stitched.height = (ty1 - ty0 + 1) * TS;
  const sc = stitched.getContext('2d');
  for (const t of tiles) sc.drawImage(t.im, (t.tx - tx0) * TS, (t.ty - ty0) * TS, TS, TS);
  const px = v => v * n * TS;
  const sx = px(mercX(lonW)) - tx0 * TS, sy = px(mercY(latN)) - ty0 * TS;
  const sw = px(mercX(lonE)) - px(mercX(lonW)), sh = px(mercY(latS)) - px(mercY(latN));
  const nx = Math.max(2, Math.round(sw)), ny = Math.max(2, Math.round(sh));
  const crop = document.createElement('canvas');
  crop.width = nx; crop.height = ny;
  const cc = crop.getContext('2d');
  cc.drawImage(stitched, sx, sy, sw, sh, 0, 0, nx, ny);
  const img = cc.getImageData(0, 0, nx, ny).data;
  const data = new Float32Array(nx * ny);
  let mn = Infinity;
  for (let i = 0; i < nx * ny; i++) {
    const e = img[i * 4] * 256 + img[i * 4 + 1] + img[i * 4 + 2] / 256 - 32768;
    data[i] = e;
    if (e < mn) mn = e;
  }
  for (let i = 0; i < data.length; i++) data[i] -= mn;
  return { data, nx, ny };
}

// Vertical scale for real elevation (the relief slider, gentled: default 2x).
const exagT = () => exag / 6;

// Drape a map crop by TRUE web-mercator position instead of the plane's linear
// UVs. The crops are mercator images; the slab is an equirectangular mesh, so
// linear UVs drift from the real geography toward the edges — and because the
// base and a detail patch cover different bboxes, their drifts differ and the
// overlap ghosts. Per-vertex mercator UVs pin every layer to the same
// geography, so they register exactly. `bbox` is the crop's geographic extent.
function setMercUV(geo, centerX, centerZ, bbox) {
  const { lat0, lon0, kx, kz } = ride.proj;
  const mxW = mercX(bbox.lonW), mxE = mercX(bbox.lonE);
  const myN = mercY(bbox.latN), myS = mercY(bbox.latS);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const lon = lon0 + (centerX + pos.getX(i)) / kx;
    const lat = lat0 - (centerZ + pos.getZ(i)) / kz;
    uv.setXY(i, (mercX(lon) - mxW) / (mxE - mxW),
                1 - (mercY(lat) - myN) / (myS - myN));
  }
  uv.needsUpdate = true;
}

// (Re)build the whole specimen block at the current relief: a map-draped top
// (a heightfield when a DEM is available, flat otherwise), ONE continuous
// earth wall running from the terrain rim down to the base, and a bottom cap.
// The wall is a single piece on purpose — an earlier version stacked a
// gradient-textured box under a separately-coloured skirt, and the join
// showed up as a horizontal seam across the side of the block.
function refreshTerrain(g) {
  if (!g.slab || !g.slabX) return;
  const kill = m => {
    if (!m) return;
    g.slab.remove(m); m.geometry?.dispose?.(); m.material?.dispose?.();
  };
  kill(g.terrain); kill(g.wire); kill(g.skirt); kill(g.cap); kill(g.shadow); kill(g.base);
  g.terrain = g.wire = g.skirt = g.cap = g.shadow = g.base = null;
  killDetail(g); // its heightfield tracks this terrain; scheduleDetail rebuilds

  const { xW, xE, zN, zS, w, d, thick } = g.slabX;
  const cx = (xW + xE) / 2, cz = (zN + zS) / 2;
  const relief = !!g.demSample; // full terrain relief in map/grid/hybrid
  const sample = relief ? g.demSample : (() => 0);
  const ex = exagT();
  const N = relief ? 96 : 2; // flat slab needs just the four corners

  // ---- top: map-draped surface ----
  const geo = new THREE.PlaneGeometry(w, d, N - 1, N - 1);
  geo.rotateX(-Math.PI / 2); // plane "up" edge -> -Z = north
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++)
    pos.setY(i, sample(cx + pos.getX(i), cz + pos.getZ(i)) * ex);
  geo.computeVertexNormals();

  if (relief) {
    // Hillshade baked into vertex colours instead of a light: the material
    // stays unlit, so the map texture keeps its exact colours (roads
    // readable) and nothing depends on three's lighting units. Flat ground
    // lands on exactly 1.0; only real slopes darken or brighten.
    const L = new THREE.Vector3(0.45, 0.82, 0.35).normalize();
    const e = Math.max(1, Math.max(w, d) / N);
    const shade = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const x = cx + pos.getX(i), zc = cz + pos.getZ(i);
      const h = sample(x, zc) * ex;
      const hx = sample(x + e, zc) * ex, hz = sample(x, zc + e) * ex;
      const nrm = new THREE.Vector3(-(hx - h) / e, 1, -(hz - h) / e).normalize();
      const f = Math.min(1.12, Math.max(0.72, nrm.dot(L) / L.y));
      shade[i * 3] = shade[i * 3 + 1] = shade[i * 3 + 2] = f;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(shade, 3));
  }
  if (g.bbox) setMercUV(geo, cx, cz, g.bbox); // exact mercator drape
  g.terrain = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: g.mapTex, vertexColors: relief }));
  g.terrain.position.set(cx, 0.15, cz);
  g.slab.add(g.terrain);

  // Wireframe relief for the "grid" view mode (a technical elevation mesh with
  // no map texture). Shares the heightfield via a cloned geometry.
  g.wire = new THREE.Mesh(geo.clone(), new THREE.MeshBasicMaterial({
    color: 0x7f97b8, wireframe: true, transparent: true, opacity: 0.55 }));
  g.wire.position.copy(g.terrain.position);
  g.slab.add(g.wire);

  // ---- side wall: rim -> base, in one piece ----
  const idx = (ix, iz) => iz * N + ix;
  const rim = [];
  for (let ix = 0; ix < N; ix++) rim.push(idx(ix, 0));
  for (let iz = 1; iz < N; iz++) rim.push(idx(N - 1, iz));
  for (let ix = N - 2; ix >= 0; ix--) rim.push(idx(ix, N - 1));
  for (let iz = N - 2; iz >= 1; iz--) rim.push(idx(0, iz));
  rim.push(idx(0, 0));

  const sp = [], suv = [];
  const bottom = -thick;
  for (let k = 0; k < rim.length - 1; k++) {
    const a = rim[k], b = rim[k + 1];
    const ax = cx + pos.getX(a), ay = pos.getY(a) + 0.15, az = cz + pos.getZ(a);
    const bx = cx + pos.getX(b), by = pos.getY(b) + 0.15, bz = cz + pos.getZ(b);
    sp.push(ax, ay, az,  bx, by, bz,  ax, bottom, az,
            bx, by, bz,  bx, bottom, bz,  ax, bottom, az);
    // v = 1 at the surface (topsoil), 0 at the base (bedrock); flipY on the
    // CanvasTexture puts the light end of the gradient at v = 1.
    const ua = k / (rim.length - 1), ub = (k + 1) / (rim.length - 1);
    suv.push(ua, 1,  ub, 1,  ua, 0,
             ub, 1,  ub, 0,  ua, 0);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sp), 3));
  sg.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(suv), 2));
  g.skirt = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({
    map: earthTex(), side: THREE.DoubleSide }));
  g.slab.add(g.skirt);

  // ---- base cap ----
  const capGeo = new THREE.PlaneGeometry(w, d);
  capGeo.rotateX(Math.PI / 2); // faces down
  g.cap = new THREE.Mesh(capGeo, new THREE.MeshBasicMaterial({ color: 0x4a3628 }));
  g.cap.position.set(cx, bottom, cz);
  g.slab.add(g.cap);

  // ---- presentation base: grid plane, then the contact shadow on top ----
  const side = Math.max(w, d);
  const baseY = bottom - Math.max(6, thick * 0.16); // small float gap
  const baseGeo = new THREE.PlaneGeometry(side * 3.4, side * 3.4);
  baseGeo.rotateX(-Math.PI / 2);
  g.base = new THREE.Mesh(baseGeo, new THREE.MeshBasicMaterial({
    map: gridTex(), transparent: true, depthWrite: false, fog: false }));
  g.base.renderOrder = -0.8;
  g.base.position.set(cx, baseY, cz);
  g.baseY = baseY; g.baseCx = cx; g.baseCz = cz; // track view lifts it to y=0
  g.slab.add(g.base);

  // Cast a little off-axis from the key light, and sit just above the grid
  // so it darkens the cells instead of z-fighting them.
  const shGeo = new THREE.PlaneGeometry(side * 1.55, side * 1.55);
  shGeo.rotateX(-Math.PI / 2);
  g.shadow = new THREE.Mesh(shGeo, new THREE.MeshBasicMaterial({
    map: shadowTex(), transparent: true, depthWrite: false, fog: false }));
  g.shadow.renderOrder = -0.5;
  g.shadow.position.set(cx + w * 0.05, baseY + Math.max(0.5, thick * 0.01),
                        cz + d * 0.04);
  g.slab.add(g.shadow);

  applyViewMode(); // honour the current view mode on every rebuild
}

// ---- View modes ----------------------------------------------------------
// map      : the map-draped specimen (default).
// grid     : wireframe elevation mesh, no map texture — a technical read.
// template : the bare track laid out complete, no terrain (a route blueprint).
// progress : same bare track, played back progressively from the start.
let viewMode = 'map';
function applyViewMode(m) {
  if (m) viewMode = m;
  const g = ride; if (!g) return;
  const vis = (o, on) => { if (o) o.visible = on; };
  const isMap = viewMode === 'map', isGrid = viewMode === 'grid';
  const isHybrid = viewMode === 'hybrid';
  const isTrack = viewMode === 'template' || viewMode === 'progress';
  const solid = isMap || isGrid || isHybrid; // has the specimen block

  vis(g.terrain, isMap || isHybrid); // hybrid shows the (flat) map slab
  vis(g.detail, isMap);              // LOD tiles only for the true map view
  vis(g.wire, isGrid);
  vis(g.skirt, solid);               // earth walls only with a solid/grid top
  vis(g.cap, solid);
  vis(g.shadow, solid);
  vis(g.base, true);                 // grid stage under every mode
  vis(g.curtain, isTrack || isGrid || isHybrid); // elevation ribbon
  // Elevation/Progress: lift the grid to the ribbon's baseline (y=0); the
  // specimen block is hidden there, so its deeper floor would just float away.
  if (g.base && g.baseY != null)
    g.base.position.y = isTrack ? 0 : g.baseY;

  document.querySelectorAll('#viewmodes button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === viewMode));

  if (viewMode === 'template') { playing = false; setPlayIcon(); setProgress(1); }
  if (viewMode === 'progress') { headT = 0; playing = true; setPlayIcon(); setProgress(0); }
  if (isMap) scheduleDetail();
}

async function buildSlab(g) {
  const { lat0, lon0, kx, kz } = g.proj;
  // Padded bbox around the ride (25% of span, min 80 m).
  let lonW = Infinity, lonE = -Infinity, latS = Infinity, latN = -Infinity;
  for (const c of g.coords) {
    lonW = Math.min(lonW, c[0]); lonE = Math.max(lonE, c[0]);
    latS = Math.min(latS, c[1]); latN = Math.max(latN, c[1]);
  }
  const padLon = Math.max((lonE - lonW) * 0.25, 80 / kx);
  const padLat = Math.max((latN - latS) * 0.25, 80 / kz);
  lonW -= padLon; lonE += padLon; latS -= padLat; latN += padLat;

  // Square the block off: grow the shorter axis symmetrically until the
  // footprint is square in METRES (the two axes have different deg->m
  // scales, so this can't be done in degrees).
  const spanX = (lonE - lonW) * kx, spanZ = (latN - latS) * kz;
  const side = Math.max(spanX, spanZ);
  const growLon = (side - spanX) / 2 / kx, growLat = (side - spanZ) / 2 / kz;
  lonW -= growLon; lonE += growLon; latS -= growLat; latN += growLat;

  let map;
  try { map = await mapCanvasForBbox(lonW, latS, lonE, latN); }
  catch { return; } // offline / blocked: keep the plain grid
  if (ride !== g) return; // a newer file was dropped while we fetched
  document.getElementById('attrib').innerHTML = map.attrib;
  const crop = map.canvas;

  const mapTex = new THREE.CanvasTexture(crop);
  mapTex.colorSpace = THREE.SRGBColorSpace;
  mapTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  g.mapTex = mapTex;
  g.bbox = { lonW, latS, lonE, latN };  // for the detail LOD + mercator UVs
  // Base resolution in metres/pixel (from MapLibre if available, else derived
  // from the raster crop); the detail LOD only overlays when it beats this.
  const kxc = Math.cos(((latS + latN) / 2) * Math.PI / 180) * 111320;
  g.baseMpp = crop._mpp || ((lonE - lonW) * kxc / crop.width);

  // Real relief for the specimen: DEM for the same bbox (flat slab if it fails).
  let dem = null;
  try { dem = await fetchDem(lonW, latS, lonE, latN); } catch {}
  if (ride !== g) return;

  // World-space slab under the route (relief grows up from y = 0).
  const xW = (lonW - lon0) * kx, xE = (lonE - lon0) * kx;
  const zN = -(latN - lat0) * kz, zS = -(latS - lat0) * kz;
  const w = xE - xW, d = zS - zN;
  g.slabX = { xW, xE, zN, zS, w, d };
  if (dem) {
    const { data, nx, ny } = dem;
    g.demSample = (x, zc) => { // bilinear metres-above-slab-base
      const u = Math.min(1, Math.max(0, (x - xW) / w)) * (nx - 1);
      const v = Math.min(1, Math.max(0, (zc - zN) / d)) * (ny - 1);
      const x0 = Math.floor(u), y0 = Math.floor(v);
      const x1 = Math.min(nx - 1, x0 + 1), y1 = Math.min(ny - 1, y0 + 1);
      const fx = u - x0, fy = v - y0;
      const a = data[y0 * nx + x0] * (1 - fx) + data[y0 * nx + x1] * fx;
      const b = data[y1 * nx + x0] * (1 - fx) + data[y1 * nx + x1] * fx;
      return a * (1 - fy) + b * fy;
    };
  }

  // Block depth: proportional to the footprint, but capped so a long ride
  // doesn't turn into a skyscraper of soil. Deep enough to read as a cut
  // specimen rather than a wafer.
  g.slabX.thick = Math.min(200, Math.max(20, 0.08 * Math.min(w, d) + 12));
  const slab = new THREE.Group();
  scene.add(slab);
  g.slab = slab;

  refreshTerrain(g);   // top + side wall + base cap, in one pass
  rebuildGeometry();   // drape the route + curtain onto the relief

  grid.visible = false;
  document.getElementById('attrib').style.display = 'block';
  if (!follow) frameCamera();
  scheduleDetail();
}

// ---- Detail LOD: the base map is one fixed-resolution texture, so zooming
// in just magnifies its pixels. When the camera settles closer, refetch a
// small patch around the look-at point at a higher zoom and drape it (as a
// heightfield matching the DEM) just above the terrain, so the streets under
// the cursor sharpen. Cleared when you pull back out.
let detailTimer = null, detailToken = 0;
function scheduleDetail() {
  if (!ride || !ride.bbox) return;
  clearTimeout(detailTimer);
  detailTimer = setTimeout(refreshDetail, 260); // after motion settles
}

function worldToLonLat(g, x, z) {
  const { lat0, lon0, kx, kz } = g.proj;
  return [lon0 + x / kx, lat0 - z / kz];
}

async function refreshDetail() {
  const g = ride; if (!g || !g.bbox || !g.slabX) return;
  const dist = camera.position.distanceTo(controls.target);
  const side = Math.max(g.slabX.w, g.slabX.d);
  // Zoomed out enough that the base texture is already adequate: drop detail.
  if (dist > side * 0.62) { killDetail(g); return; }

  // Patch bbox: a square around the look-at point sized to the view, clamped
  // inside the slab. Generous radius so a wide area sharpens, not just the
  // spot under the cursor.
  const r = Math.min(side / 2, Math.max(side * 0.28, dist * 1.6));
  const [clon, clat] = worldToLonLat(g, controls.target.x, controls.target.z);
  const { kx, kz } = g.proj;
  const dLon = r / kx, dLat = r / kz;
  const lonW = Math.max(g.bbox.lonW, clon - dLon), lonE = Math.min(g.bbox.lonE, clon + dLon);
  const latS = Math.max(g.bbox.latS, clat - dLat), latN = Math.min(g.bbox.latN, clat + dLat);
  if (lonE <= lonW || latN <= latS) return;

  const token = ++detailToken;
  let crop;
  try { crop = await mlRender(lonW, latS, lonE, latN, 3072); }
  catch {
    try { crop = await rasterStitch(lonW, latS, lonE, latN, 6144, 200); } catch { return; }
  }
  if (ride !== g || token !== detailToken) return;        // superseded
  // Overlay only when it's meaningfully sharper than the base.
  if (crop._mpp && g.baseMpp && crop._mpp > g.baseMpp * 0.7) { killDetail(g); return; }

  // Feather the patch edges to alpha 0 so the sharp overlay dissolves into
  // the base texture. Use ONE separable mask f(x)*f(y): overlapping edge
  // bands double-subtract at the corners and leave blotchy smudges there.
  const fw = crop.width, fh = crop.height;
  const mask = document.createElement('canvas');
  mask.width = 96; mask.height = 96;
  const mc = mask.getContext('2d');
  const taper = (horiz) => {
    const gr = horiz ? mc.createLinearGradient(0, 0, 96, 0)
                     : mc.createLinearGradient(0, 0, 0, 96);
    // Opaque core, smooth taper to transparent over the outer ~16% each side.
    gr.addColorStop(0.00, 'rgba(0,0,0,0)');
    gr.addColorStop(0.16, 'rgba(0,0,0,1)');
    gr.addColorStop(0.84, 'rgba(0,0,0,1)');
    gr.addColorStop(1.00, 'rgba(0,0,0,0)');
    mc.fillStyle = gr; mc.fillRect(0, 0, 96, 96);
  };
  taper(true);                                   // f(x)
  mc.globalCompositeOperation = 'destination-in';
  taper(false);                                  // * f(y)  (multiplies alpha)
  const fx = crop.getContext('2d');
  fx.globalCompositeOperation = 'destination-in';
  fx.imageSmoothingEnabled = true;
  fx.drawImage(mask, 0, 0, fw, fh);              // smooth bilinear upscale
  fx.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(crop);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;

  const { lat0, lon0, kx: KX, kz: KZ } = g.proj;
  const xW = (lonW - lon0) * KX, xE = (lonE - lon0) * KX;
  const zN = -(latN - lat0) * KZ, zS = -(latS - lat0) * KZ;
  const pw = xE - xW, pd = zS - zN;
  const cx = (xW + xE) / 2, cz = (zN + zS) / 2;
  const ex = exagT();
  const sample = g.demSample || (() => 0);
  const M = 48;
  const geo = new THREE.PlaneGeometry(pw, pd, M - 1, M - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++)
    pos.setY(i, sample(cx + pos.getX(i), cz + pos.getZ(i)) * ex);
  geo.computeVertexNormals();
  setMercUV(geo, cx, cz, { lonW, latS, lonE, latN }); // register with the base

  killDetail(g);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true,
    depthWrite: false }); // feathered edges blend into the base
  mat.polygonOffset = true;            // sit cleanly on top of the base terrain
  mat.polygonOffsetFactor = -1; mat.polygonOffsetUnits = -1;
  g.detail = new THREE.Mesh(geo, mat);
  g.detail.position.set(cx, 0.35, cz);
  g.detail.renderOrder = 1;
  g.slab.add(g.detail);
}

function killDetail(g) {
  if (g && g.detail) {
    g.slab?.remove(g.detail);
    g.detail.geometry.dispose(); g.detail.material.map?.dispose();
    g.detail.material.dispose(); g.detail = null;
  }
}

function frameCamera() {
  const box = new THREE.Box3().setFromPoints(ride.drawn);
  if (ride.slab) box.union(new THREE.Box3().setFromObject(ride.slab));
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const d = Math.max(size.x, size.z, size.y) * 1.7 + 120;
  controls.target.copy(c);
  camera.position.set(c.x + d * 0.55, c.y + d * 0.7, c.z + d * 0.75);
  camera.near = d / 200; camera.far = d * 40; camera.updateProjectionMatrix();
  // Haze only well beyond the framed block, so it reads as depth on a
  // distant corner without ever veiling the map.
  scene.fog.near = d * 1.6; scene.fog.far = d * 6;
  // Default chase distance, and scroll limits that suit this ride's scale.
  ride.chaseDist = Math.min(1600, Math.max(160, d * 0.22));
  controls.minDistance = Math.max(25, d / 400);
  controls.maxDistance = d * 6;
  sky.scale.setScalar(d * 12); // comfortably inside camera.far (d * 40)
}

// Reveal + head position, driven by time fraction 0..1.
function setProgress(frac) {
  const g = ride; if (!g) return;
  headT = Math.min(1, Math.max(0, frac));
  const seg = Math.max(1, Math.round(g.segCount * headT));
  g.route.geometry.instanceCount = seg;
  if (g.curtain) g.curtain.geometry.setDrawRange(0, seg * 6);

  const t = g.tMin + (g.tMax - g.tMin) * headT;
  document.getElementById('scrub').value = String(Math.round(headT * 1000));
  document.getElementById('clock').textContent = mmss(t);

  // Head marker exists only after the first full build.
  if (!g.head) return;
  let i = 1; while (i < g.tArr.length && g.tArr[i] < t) i++;
  const a = g.drawn[i - 1], b = g.drawn[Math.min(i, g.drawn.length - 1)];
  const ta = g.tArr[i - 1], tb = g.tArr[Math.min(i, g.tArr.length - 1)];
  const f = tb > ta ? (t - ta) / (tb - ta) : 0;
  const hp = a.clone().lerp(b, f);
  g.head.position.copy(hp);
  // Point the bike along the direction of travel.
  const dxw = b.x - a.x, dzw = b.z - a.z;
  if (Math.abs(dxw) + Math.abs(dzw) > 1e-6)
    g.head.rotation.y = Math.atan2(-dzw, dxw);

  g.headPos = hp;
  // Chase cam: translate BOTH the orbit target and the camera by the same
  // delta. That follows the bike while leaving the offset vector — i.e. the
  // angle and distance the user set by dragging and scrolling — untouched,
  // so OrbitControls stays fully usable mid-chase. (Assigning
  // camera.position outright, as this used to, fought the controls and
  // pinned the view at one fixed distance.)
  if (follow) {
    const step = hp.clone().sub(controls.target).multiplyScalar(0.15);
    controls.target.add(step);
    camera.position.add(step);
  }
}

// Put the camera at a comfortable chase distance, keeping the direction the
// user is currently viewing from.
function chaseSnap() {
  const g = ride; if (!g) return;
  const hp = g.headPos || g.drawn[0];
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1e-6) dir.set(0.55, 0.6, 0.75);
  dir.normalize().multiplyScalar(g.chaseDist);
  controls.target.copy(hp);
  camera.position.copy(hp).add(dir);
}

function mmss(s) {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function showChrome(sum, vMin, vMax) {
  document.getElementById('header').style.display = 'block';
  document.getElementById('legend').style.display = 'block';
  document.getElementById('transport').style.display = 'flex';
  document.getElementById('hint').style.display = 'block';
  document.getElementById('viewmodes').style.display = 'flex';
  const d = sum.ended_at ? new Date(sum.ended_at * 1000) : null;
  document.getElementById('date').textContent = d
    ? d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const set = (id, v) => document.getElementById(id).textContent = v;
  set('s-dist', (sum.dist_km ?? 0).toFixed(1));
  set('s-time', mmss(sum.moving_s ?? 0));
  set('s-avg', Math.round(sum.avg_kmh ?? 0));
  set('s-max', Math.round(sum.max_kmh ?? 0));
  set('s-elev', Math.round(climb(ride.P)));
  set('s-hr', sum.has_hr ? Math.round(sum.avg_hr) : '--');
  set('lg-min', Math.round(vMin)); set('lg-max', Math.round(vMax));
}

function climb(P) { // positive vertical steps (raw metres, pre-exaggeration)
  let g = 0;
  for (let i = 1; i < P.length; i++) { const d = P[i].y - P[i - 1].y; if (d > 0.3) g += d; }
  return g;
}

// ---- loading ----
function loadText(txt) {
  document.getElementById('err').textContent = '';
  try {
    buildRide(JSON.parse(txt));
    document.getElementById('drop').classList.add('hide');
    playing = true; setPlayIcon();
  } catch (e) {
    document.getElementById('err').textContent = 'Could not read the file: ' + e.message;
  }
}
function loadFile(file) {
  const r = new FileReader();
  r.onload = () => loadText(String(r.result));
  r.readAsText(file);
}

// ---- interaction ----
const drop = document.getElementById('drop'), fileInput = document.getElementById('file');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (e.target === document.body) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0]; if (f) loadFile(f);
});

function setPlayIcon() {
  document.getElementById('play').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
}
document.getElementById('play').addEventListener('click', () => {
  if (!ride) return;
  if (headT >= 1) headT = 0; // replay from the start
  playing = !playing; setPlayIcon();
});
document.getElementById('scrub').addEventListener('input', e => {
  playing = false; setPlayIcon();
  setProgress(Number(e.target.value) / 1000);
});
document.querySelectorAll('#viewmodes button').forEach(b =>
  b.addEventListener('click', () => {
    if (!ride) return;
    viewMode = b.dataset.mode;
    if (ride.slabX) refreshTerrain(ride); // relief vs flat (hybrid) surface
    rebuildGeometry();                     // route height + curtain per mode
    applyViewMode();                       // visibilities, playback, buttons
    if (!follow) frameCamera(); // reframe: ribbon vs specimen differ in extent
  }));
document.getElementById('follow').addEventListener('click', e => {
  follow = !follow; e.target.classList.toggle('on', follow);
  if (!ride) return;
  if (follow) chaseSnap();   // pull back to a sensible chase distance
  else frameCamera();        // back to the framed overview
});
document.getElementById('exag').addEventListener('input', e => {
  exag = Number(e.target.value);
  if (ride) {
    rebuildGeometry();
    if (ride.demSample) refreshTerrain(ride); // rebuilds terrain; detail restamps
    scheduleDetail();
  }
});

// ---- loop ----
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (ride && playing) {
    const dur = Math.max(4, (ride.tMax - ride.tMin) / 6); // ~6x real time, min 4s
    headT += dt / dur;
    if (headT >= 1) { headT = 1; playing = false; setPlayIcon(); }
    setProgress(headT);
  }
  controls.update();
  sky.position.copy(camera.position); // dome rides along, never clips
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (ride?.mat) ride.mat.resolution.set(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();
</script>
</body>
</html>
