<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ride Viewer</title>
<!--
  Standalone Three.js viewer for a cyclomp ride export. Drag a .geojson
  produced by the app's EXPORT button onto the window (or click to pick one).
  Clean light theme: the route is drawn in 3D with elevation as height and an
  "elevation curtain" down to the ground; colour encodes speed on a single-hue
  orange ramp (slow = light, fast = deep). Fly-through reveal, chase cam,
  scrub timeline, stat row. No build step; serve this folder and open it
  (needs internet once for the Three.js CDN).
-->
<style>
  :root {
    --bg: #f5f6f8;          /* page + 3D backdrop family */
    --card: #ffffff;
    --ink: #242428;         /* primary text */
    --muted: #6d6d78;       /* secondary text */
    --faint: #9a9aa5;
    --border: #e6e6eb;
    --accent: #fc5200;      /* primary action / brand */
    --accent-dark: #d94700;
    --ramp-lo: #fcd0ae;     /* slow  (single hue, light->dark) */
    --ramp-hi: #8f2d00;     /* fast */
    --start: #16a34a;
    --finish: #dc2626;
    --shadow: 0 1px 3px rgba(20,20,30,.08), 0 4px 16px rgba(20,20,30,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---- Live terrain map mode (MapLibre) ---- */
  #map { position: fixed; inset: 0; display: none; z-index: 1; }
  #map .maplibregl-ctrl-bottom-right { bottom: 84px; }

  /* ---- Header: brand + ride title + stat row ---- */
  header { position: fixed; top: 0; left: 0; right: 0; background: var(--card);
    border-bottom: 1px solid var(--border); z-index: 3; }
  .head-inner { max-width: 1080px; margin: 0 auto; padding: 14px 24px 0; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { width: 14px; height: 14px; border-radius: 3px;
    background: var(--accent); align-self: center; }
  .brand h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .brand .date { color: var(--muted); font-size: 13px; }
  #stats { display: flex; flex-wrap: wrap; gap: 0 36px; padding: 10px 0 14px; }
  .stat { min-width: 88px; }
  .stat .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; margin-top: 1px; }

  /* ---- Legend ---- */
  #legend { position: fixed; left: 24px; bottom: 104px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    padding: 10px 14px; width: 200px; z-index: 3; }
  #legend .cap { font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 6px; }
  #legend .bar { height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, var(--ramp-lo), var(--accent), var(--ramp-hi)); }
  #legend .row { display: flex; justify-content: space-between; color: var(--muted);
    font-size: 11px; margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* ---- Transport bar ---- */
  #transport { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 24px; width: min(720px, calc(100% - 48px));
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    box-shadow: var(--shadow); padding: 10px 18px 10px 10px; z-index: 3; }
  #play { width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 15px; cursor: pointer;
    display: grid; place-items: center; flex: none; transition: background .15s; }
  #play:hover { background: var(--accent-dark); }
  #scrub { flex: 1; accent-color: var(--accent); height: 4px; cursor: pointer; }
  #clock { color: var(--ink); font-size: 14px; font-weight: 600; min-width: 52px;
    text-align: right; font-variant-numeric: tabular-nums; }
  .pill { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--muted);
    background: transparent; border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 13px; cursor: pointer; white-space: nowrap; transition: all .15s; }
  .pill:hover { border-color: var(--faint); color: var(--ink); }
  .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ctl { display: flex; align-items: center; gap: 7px; color: var(--muted);
    font-size: 11.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; white-space: nowrap; }
  .ctl input[type=range] { width: 80px; accent-color: var(--accent); }

  /* ---- Drop / empty state ---- */
  #drop { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(245,246,248,.94); z-index: 5;
    cursor: pointer; }
  #drop.hide { display: none; }
  #drop .box { background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow); padding: 44px 56px;
    text-align: center; max-width: 460px; }
  #drop .well { border: 2px dashed var(--border); border-radius: 12px;
    padding: 32px 28px; transition: border-color .15s, background .15s; }
  body.dragging #drop .well { border-color: var(--accent); background: #fff7f2; }
  #drop svg { width: 44px; height: 44px; stroke: var(--accent); margin-bottom: 10px; }
  #drop .big { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  #drop .small { color: var(--muted); font-size: 13.5px; line-height: 1.55;
    margin-top: 8px; }
  #drop .small code { background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; font-size: 12px; }
  #err { color: var(--finish); font-size: 13px; min-height: 18px; margin-top: 10px;
    font-weight: 500; }

  /* ---- Hint chip ---- */
  #hint { position: fixed; right: 24px; bottom: 104px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
    color: var(--muted); font-size: 11.5px; padding: 8px 12px; z-index: 3; }

  /* ---- Map attribution (required by the tile providers) ---- */
  #attrib { position: fixed; right: 24px; bottom: 74px; background: rgba(255,255,255,.85);
    border: 1px solid var(--border); border-radius: 6px; color: var(--faint);
    font-size: 10px; padding: 3px 8px; z-index: 3; }
  #attrib a { color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="map"></div>

<header style="display:none" id="header">
  <div class="head-inner">
    <div class="brand">
      <span class="mark"></span>
      <h1>Ride Viewer</h1>
      <span class="date" id="date"></span>
    </div>
    <div id="stats">
      <div class="stat"><div class="v"><span id="s-dist">0.0</span><small>km</small></div><div class="k">Distance</div></div>
      <div class="stat"><div class="v"><span id="s-time">0:00</span></div><div class="k">Moving Time</div></div>
      <div class="stat"><div class="v"><span id="s-avg">0</span><small>km/h</small></div><div class="k">Avg Speed</div></div>
      <div class="stat"><div class="v"><span id="s-max">0</span><small>km/h</small></div><div class="k">Max Speed</div></div>
      <div class="stat"><div class="v"><span id="s-elev">0</span><small>m</small></div><div class="k">Elev Gain</div></div>
      <div class="stat"><div class="v"><span id="s-hr">--</span><small>bpm</small></div><div class="k">Avg HR</div></div>
    </div>
  </div>
</header>

<div id="legend" style="display:none">
  <div class="cap">Speed</div>
  <div class="bar"></div>
  <div class="row"><span id="lg-min">0</span><span>km/h</span><span id="lg-max">0</span></div>
</div>

<div id="hint" style="display:none">Drag to orbit &nbsp;·&nbsp; scroll to zoom</div>
<div id="attrib" style="display:none"></div>

<div id="transport" style="display:none">
  <button id="play" aria-label="Play">&#9654;</button>
  <input id="scrub" type="range" min="0" max="1000" value="1000" />
  <span id="clock">0:00</span>
  <button id="follow" class="pill">Chase cam</button>
  <button id="viewtoggle" class="pill">Terrain map</button>
  <span class="ctl" id="reliefctl">Relief <input id="exag" type="range" min="0" max="40" value="12" /></span>
</div>

<div id="drop">
  <div class="box">
    <div class="well">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
      </svg>
      <div class="big">Upload your ride</div>
      <div class="small">Drop the <code>.geojson</code> here, or click to browse.<br/>
        Export one from cyclomp: <strong>Log&nbsp;→ open a ride&nbsp;→ Export</strong>.</div>
      <div id="err"></div>
    </div>
  </div>
  <input id="file" type="file" accept=".geojson,.json,application/geo+json" style="display:none" />
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const COL = {
  bg: 0xeef0f3, grid: 0xd7dce2, grid2: 0xe4e8ed,
  rampLo: 0xfcd0ae, accent: 0xfc5200, rampHi: 0x8f2d00,
  start: 0x16a34a, finish: 0xdc2626, white: 0xffffff,
};

// ---- scene ----
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.bg);
scene.fog = new THREE.Fog(COL.bg, 500, 3200);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 20000);
camera.position.set(300, 320, 480);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495; // stay above the ground

// Ground grid.
const grid = new THREE.GridHelper(4000, 80, COL.grid, COL.grid2);
grid.material.transparent = true; grid.material.opacity = 0.9;
scene.add(grid);

// Soft light rig — only the Lambert meshes (terrain, flags, bike) react;
// the unlit route/curtain/slab-side materials ignore it.
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.8);
sun.position.set(300, 600, 200);
scene.add(sun);

// ---- ride state ----
let ride = null;
let playing = false, headT = 1, follow = false, exag = 12;

function disposeObj(o) {
  if (!o) return;
  scene.remove(o);
  o.geometry?.dispose?.(); o.material?.dispose?.();
  o.children?.slice().forEach(disposeObj);
}
function clearRide() {
  if (!ride) return;
  for (const o of [ride.route, ride.curtain, ride.head, ride.startDot,
                   ride.endDot, ride.slab])
    disposeObj(o);
  grid.visible = true;
  document.getElementById('attrib').style.display = 'none';
  if (liveMap) { try { liveMap.remove(); } catch {} liveMap = null; }
  if (mapMode) setMapMode(false);
  ride = null;
}

// Single-hue orange ramp: slow = light, fast = deep.
const c1 = new THREE.Color(COL.rampLo), c2 = new THREE.Color(COL.accent),
      c3 = new THREE.Color(COL.rampHi);
function speedColor(v, out) {
  if (v < 0.5) out.copy(c1).lerp(c2, v / 0.5);
  else out.copy(c2).lerp(c3, (v - 0.5) / 0.5);
  return out;
}

function project(coords) {
  // Equirectangular metres around the centroid; north = -Z, up = +Y.
  // Returns the projection constants too — the map slab reuses them.
  let lat0 = 0, lon0 = 0;
  for (const c of coords) { lon0 += c[0]; lat0 += c[1]; }
  lon0 /= coords.length; lat0 /= coords.length;
  const kx = Math.cos(lat0 * Math.PI / 180) * 111320, kz = 110540;
  let altMin = Infinity;
  for (const c of coords) altMin = Math.min(altMin, c[2] ?? 0);
  const pts = coords.map(c => new THREE.Vector3(
    (c[0] - lon0) * kx, ((c[2] ?? 0) - altMin), -(c[1] - lat0) * kz));
  return { pts, lat0, lon0, kx, kz };
}

// Start / finish: a little flag on a pole (finish gets a checker texture).
function makeFlag(color, checkered = false) {
  const gp = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 24, 8),
    new THREE.MeshLambertMaterial({ color: 0x8b8b94 }));
  pole.position.y = 12;
  gp.add(pole);
  let mat;
  if (checkered) {
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const x = c.getContext('2d');
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      x.fillStyle = (i + j) % 2 ? '#17171b' : '#ffffff';
      x.fillRect(i * 8, j * 8, 8, 8);
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshLambertMaterial({ map: t, side: THREE.DoubleSide });
  } else {
    mat = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
  }
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(13, 8), mat);
  flag.position.set(6.9, 19.5, 0);
  gp.add(flag);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 1.6, 10),
    new THREE.MeshLambertMaterial({ color: 0x6d6d78 }));
  base.position.y = 0.8;
  gp.add(base);
  scene.add(gp);
  return gp;
}

// Current position: a low-poly bike built from primitives, facing +X.
function makeBike() {
  const g = new THREE.Group();
  const orange = new THREE.MeshLambertMaterial({ color: COL.accent });
  const dark = new THREE.MeshLambertMaterial({ color: 0x2b2b31 });
  const wheelG = new THREE.TorusGeometry(4, 0.8, 6, 14);
  const w1 = new THREE.Mesh(wheelG, dark); w1.position.set(-5.5, 4, 0); g.add(w1);
  const w2 = new THREE.Mesh(wheelG, dark); w2.position.set(5.5, 4, 0); g.add(w2);
  const tube = (ax, ay, bx, by, r = 0.7) => {
    const a = new THREE.Vector3(ax, ay, 0), b = new THREE.Vector3(bx, by, 0);
    const d = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 6), orange);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
    g.add(m);
  };
  tube(-5.5, 4, -1.2, 9.2);   // seat stay
  tube(-5.5, 4, 1.5, 3.6);    // chain stay
  tube(1.5, 3.6, -1.2, 9.2);  // seat tube
  tube(1.5, 3.6, 4.6, 9.2);   // down tube
  tube(-1.2, 9.2, 4.6, 9.2);  // top tube
  tube(4.6, 9.2, 5.5, 4);     // fork
  const saddle = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.9, 1.5), dark);
  saddle.position.set(-1.6, 10, 0); g.add(saddle);
  const bars = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 5.2), dark);
  bars.position.set(4.6, 10, 0); g.add(bars);
  scene.add(g);
  return g;
}

function buildRide(gj) {
  clearRide();
  const feat = (gj.features || []).find(f => f.geometry?.type === 'LineString');
  if (!feat) throw new Error('no LineString feature in this GeoJSON');
  const coords = feat.geometry.coordinates;
  if (coords.length < 2) throw new Error('track has fewer than 2 points');
  const speed = feat.properties?.speed_kmh || coords.map(() => 0);
  const tArr = feat.properties?.t_s || coords.map((_, i) => i);

  const proj = project(coords);
  const P = proj.pts;
  const vMax = Math.max(1e-3, ...speed), vMin = Math.min(...speed);
  const vNorm = speed.map(s => (s - vMin) / Math.max(1e-3, vMax - vMin));
  const cumD = [0];
  for (let i = 1; i < P.length; i++) cumD.push(cumD[i - 1] + P[i].distanceTo(P[i - 1]));

  const g = { P, proj, coords, speed, tArr, vNorm, vMin, vMax, cumD,
              tMin: tArr[0], tMax: tArr[tArr.length - 1],
              summary: gj.properties || {} };
  ride = g;

  rebuildGeometry(); // positions depend on the relief slider

  // Markers scale with the ride's footprint so a city loop and an alpine
  // century both read correctly.
  const span = new THREE.Box3().setFromPoints(P).getSize(new THREE.Vector3());
  g.mScale = Math.min(30, Math.max(0.35, Math.max(span.x, span.z) / 260));
  g.startDot = makeFlag(COL.start);
  g.endDot = makeFlag(null, true); // checkered finish
  g.head = makeBike();
  for (const m of [g.startDot, g.endDot, g.head]) m.scale.setScalar(g.mScale);
  g.startDot.position.copy(g.drawn[0]);
  g.endDot.position.copy(g.drawn[g.drawn.length - 1]);

  frameCamera();
  headT = 1; setProgress(1);
  showChrome(g.summary, vMin, vMax);
  buildSlab(g); // async: the map diorama pops in when its tiles arrive
}

const ROUTE_LIFT = 2; // metres above the slab top, so the line never z-fights

function rebuildGeometry() {
  const g = ride; if (!g) return;
  // With a DEM the route is draped on the relief (GPS altitude noise would
  // float it above / sink it below the surface); flat slab keeps GPS profile.
  const pts = g.P.map(p => {
    const y = g.demSample ? g.demSample(p.x, p.z) * exagT() : p.y * exag;
    return new THREE.Vector3(p.x, y + ROUTE_LIFT, p.z);
  });
  g.drawn = pts;

  // Route line, per-vertex speed colour.
  const pos = new Float32Array(pts.length * 3);
  const col = new Float32Array(pts.length * 3);
  const tmp = new THREE.Color();
  for (let i = 0; i < pts.length; i++) {
    pos[i * 3] = pts[i].x; pos[i * 3 + 1] = pts[i].y; pos[i * 3 + 2] = pts[i].z;
    speedColor(g.vNorm[i], tmp);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  const geo = new LineGeometry();
  geo.setPositions(pos); geo.setColors(col);
  disposeObj(g.route);
  const mat = new LineMaterial({ vertexColors: true, linewidth: 5,
    worldUnits: false, transparent: true });
  mat.resolution.set(innerWidth, innerHeight);
  const line = new Line2(geo, mat);
  line.computeLineDistances();
  scene.add(line); g.route = line; g.mat = mat; g.segCount = pts.length - 1;

  // Elevation curtain: a translucent wall from the route down to the ground,
  // tinted by the same ramp — gives the flyover its sense of relief.
  const n = pts.length;
  const cPos = new Float32Array(n * 2 * 3);
  const cCol = new Float32Array(n * 2 * 3);
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const by = g.demSample ? g.demSample(p.x, p.z) * exagT() : 0;
    cPos.set([p.x, p.y, p.z, p.x, by, p.z], i * 6);
    speedColor(g.vNorm[i], tmp);
    cCol.set([tmp.r, tmp.g, tmp.b, tmp.r, tmp.g, tmp.b], i * 6);
  }
  const idx = [];
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, b, c, b, d, c);
  }
  const cg = new THREE.BufferGeometry();
  cg.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
  cg.setAttribute('color', new THREE.BufferAttribute(cCol, 3));
  cg.setIndex(idx);
  disposeObj(g.curtain);
  const curtain = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.14,
    side: THREE.DoubleSide, depthWrite: false }));
  scene.add(curtain); g.curtain = curtain;

  if (g.startDot) g.startDot.position.copy(pts[0]);
  if (g.endDot) g.endDot.position.copy(pts[pts.length - 1]);
  setProgress(headT);
}

// ---- Map diorama: a slab "cut out of the earth" under the route.
// Basemap raster tiles (CARTO Positron, CORS-enabled) are stitched onto a
// canvas, cropped to the padded ride bbox, and laid on top of a box whose
// sides wear a soil/rock gradient. Fails silently (grid stays) when offline.
const mercX = lon => (lon + 180) / 360;
const mercY = lat => {
  const s = Math.sin(lat * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
};
const loadImg = url => new Promise((res, rej) => {
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => res(im); im.onerror = () => rej(new Error('tile failed'));
  im.src = url;
});

// -- Primary map source: MapLibre GL + OpenFreeMap (free, no API key — the
// same tile host the cyclomp app uses). The bbox is rendered once in a
// hidden container, grabbed as a canvas, and the map is thrown away.
let maplibreLoad = null;
function loadMapLibre() {
  if (window.maplibregl) return Promise.resolve();
  if (!maplibreLoad) maplibreLoad = new Promise((res, rej) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('maplibre load failed'));
    document.head.appendChild(s);
  });
  return maplibreLoad;
}

async function renderVectorMap(lonW, latS, lonE, latN) {
  await loadMapLibre();
  const aspect = (mercX(lonE) - mercX(lonW)) / (mercY(latS) - mercY(latN));
  const base = 1024;
  const w = aspect >= 1 ? base : Math.max(256, Math.round(base * aspect));
  const h = aspect >= 1 ? Math.max(256, Math.round(base / aspect)) : base;
  const div = document.createElement('div');
  div.style.cssText = `position:fixed;left:-10000px;top:0;width:${w}px;height:${h}px;`;
  document.body.appendChild(div);
  return new Promise((res, rej) => {
    const m = new maplibregl.Map({
      container: div,
      style: 'https://tiles.openfreemap.org/styles/positron',
      interactive: false, attributionControl: false,
      preserveDrawingBuffer: true, fadeDuration: 0, pixelRatio: 2,
    });
    const cleanup = () => { clearTimeout(to); try { m.remove(); } catch {} div.remove(); };
    const to = setTimeout(() => { cleanup(); rej(new Error('map render timeout')); }, 20000);
    m.once('load', () => {
      m.fitBounds([[lonW, latS], [lonE, latN]], { padding: 0, duration: 0 });
      m.once('idle', () => {
        try {
          const src = m.getCanvas();
          const c = document.createElement('canvas');
          c.width = src.width; c.height = src.height;
          c.getContext('2d').drawImage(src, 0, 0);
          cleanup(); res(c);
        } catch (e) { cleanup(); rej(e); }
      });
    });
  });
}

// -- Fallback: stitch OSM standard raster tiles (no key either), cropped to
// the exact bbox. Busier style, but keeps the slab working if the vector
// path is blocked.
async function rasterStitch(lonW, latS, lonE, latN) {
  const TS = 256;
  let z = 3;
  for (let cand = 19; cand >= 3; cand--) {
    const w = (mercX(lonE) - mercX(lonW)) * (1 << cand) * TS;
    const h = (mercY(latS) - mercY(latN)) * (1 << cand) * TS;
    const tiles = (Math.floor(mercX(lonE) * (1 << cand)) - Math.floor(mercX(lonW) * (1 << cand)) + 1) *
                  (Math.floor(mercY(latS) * (1 << cand)) - Math.floor(mercY(latN) * (1 << cand)) + 1);
    if (Math.max(w, h) <= 2048 && tiles <= 30) { z = cand; break; }
  }
  const n = 1 << z;
  const tx0 = Math.floor(mercX(lonW) * n), tx1 = Math.floor(mercX(lonE) * n);
  const ty0 = Math.floor(mercY(latN) * n), ty1 = Math.floor(mercY(latS) * n);
  const jobs = [];
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++)
      jobs.push(loadImg(`https://tile.openstreetmap.org/${z}/${tx}/${ty}.png`)
        .then(im => ({ im, tx, ty })));
  const tiles = await Promise.all(jobs);
  const stitched = document.createElement('canvas');
  stitched.width = (tx1 - tx0 + 1) * TS; stitched.height = (ty1 - ty0 + 1) * TS;
  const sc = stitched.getContext('2d');
  for (const t of tiles) sc.drawImage(t.im, (t.tx - tx0) * TS, (t.ty - ty0) * TS, TS, TS);
  const px = v => v * n * TS;
  const sx = px(mercX(lonW)) - tx0 * TS, sy = px(mercY(latN)) - ty0 * TS;
  const sw = px(mercX(lonE)) - px(mercX(lonW)), sh = px(mercY(latS)) - px(mercY(latN));
  const crop = document.createElement('canvas');
  crop.width = Math.max(2, Math.round(sw)); crop.height = Math.max(2, Math.round(sh));
  crop.getContext('2d').drawImage(stitched, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
  return crop;
}

const OSM_LINK = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
async function mapCanvasForBbox(lonW, latS, lonE, latN) {
  try {
    return { canvas: await renderVectorMap(lonW, latS, lonE, latN),
             attrib: OSM_LINK + ' &middot; <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>' };
  } catch {}
  return { canvas: await rasterStitch(lonW, latS, lonE, latN), attrib: OSM_LINK };
}

function earthSideTexture() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 128;
  const x = c.getContext('2d');
  const grad = x.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0.00, '#d9c7a8'); // thin topsoil line under the map
  grad.addColorStop(0.06, '#b08a5f');
  grad.addColorStop(0.45, '#8a6647');
  grad.addColorStop(1.00, '#5d4531'); // bedrock
  x.fillStyle = grad; x.fillRect(0, 0, 4, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Terrarium raster-dem stitched + cropped to the bbox, decoded to metres and
// rebased to its lowest point (the slab's ground level).
async function fetchDem(lonW, latS, lonE, latN) {
  const TS = 256;
  let z = 3;
  for (let cand = 15; cand >= 3; cand--) {
    const w = (mercX(lonE) - mercX(lonW)) * (1 << cand) * TS;
    const h = (mercY(latS) - mercY(latN)) * (1 << cand) * TS;
    const tiles = (Math.floor(mercX(lonE) * (1 << cand)) - Math.floor(mercX(lonW) * (1 << cand)) + 1) *
                  (Math.floor(mercY(latS) * (1 << cand)) - Math.floor(mercY(latN) * (1 << cand)) + 1);
    if (Math.max(w, h) <= 320 && tiles <= 12) { z = cand; break; }
  }
  const n = 1 << z;
  const tx0 = Math.floor(mercX(lonW) * n), tx1 = Math.floor(mercX(lonE) * n);
  const ty0 = Math.floor(mercY(latN) * n), ty1 = Math.floor(mercY(latS) * n);
  const jobs = [];
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++)
      jobs.push(loadImg(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${tx}/${ty}.png`)
        .then(im => ({ im, tx, ty })));
  const tiles = await Promise.all(jobs);
  const stitched = document.createElement('canvas');
  stitched.width = (tx1 - tx0 + 1) * TS; stitched.height = (ty1 - ty0 + 1) * TS;
  const sc = stitched.getContext('2d');
  for (const t of tiles) sc.drawImage(t.im, (t.tx - tx0) * TS, (t.ty - ty0) * TS, TS, TS);
  const px = v => v * n * TS;
  const sx = px(mercX(lonW)) - tx0 * TS, sy = px(mercY(latN)) - ty0 * TS;
  const sw = px(mercX(lonE)) - px(mercX(lonW)), sh = px(mercY(latS)) - px(mercY(latN));
  const nx = Math.max(2, Math.round(sw)), ny = Math.max(2, Math.round(sh));
  const crop = document.createElement('canvas');
  crop.width = nx; crop.height = ny;
  const cc = crop.getContext('2d');
  cc.drawImage(stitched, sx, sy, sw, sh, 0, 0, nx, ny);
  const img = cc.getImageData(0, 0, nx, ny).data;
  const data = new Float32Array(nx * ny);
  let mn = Infinity;
  for (let i = 0; i < nx * ny; i++) {
    const e = img[i * 4] * 256 + img[i * 4 + 1] + img[i * 4 + 2] / 256 - 32768;
    data[i] = e;
    if (e < mn) mn = e;
  }
  for (let i = 0; i < data.length; i++) data[i] -= mn;
  return { data, nx, ny };
}

// Vertical scale for real elevation (the relief slider, gentled: default 2x).
const exagT = () => exag / 6;

// (Re)build the slab's top at the current relief: a map-draped heightfield
// with a soil skirt when a DEM is available, a flat plane otherwise.
function refreshTerrain(g) {
  if (!g.slab || !g.slabX) return;
  const kill = m => {
    if (!m) return;
    g.slab.remove(m); m.geometry?.dispose?.(); m.material?.dispose?.();
  };
  kill(g.terrain); kill(g.skirt); g.terrain = g.skirt = null;
  const { xW, xE, zN, zS, w, d } = g.slabX;
  const cx = (xW + xE) / 2, cz = (zN + zS) / 2;

  if (!g.demSample) {
    const topGeo = new THREE.PlaneGeometry(w, d);
    topGeo.rotateX(-Math.PI / 2); // plane "up" edge -> -Z = north
    g.terrain = new THREE.Mesh(topGeo, new THREE.MeshBasicMaterial({ map: g.mapTex }));
    g.terrain.position.set(cx, 0.15, cz);
    g.slab.add(g.terrain);
    return;
  }

  const ex = exagT();
  const N = 96;
  const geo = new THREE.PlaneGeometry(w, d, N - 1, N - 1);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++)
    pos.setY(i, g.demSample(cx + pos.getX(i), cz + pos.getZ(i)) * ex);
  geo.computeVertexNormals();
  g.terrain = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: g.mapTex }));
  g.terrain.position.set(cx, 0.15, cz);
  g.slab.add(g.terrain);

  // Soil skirt: close the gap between the raised relief edge and the box.
  const idx = (ix, iz) => iz * N + ix;
  const rim = [];
  for (let ix = 0; ix < N; ix++) rim.push(idx(ix, 0));
  for (let iz = 1; iz < N; iz++) rim.push(idx(N - 1, iz));
  for (let ix = N - 2; ix >= 0; ix--) rim.push(idx(ix, N - 1));
  for (let iz = N - 2; iz >= 1; iz--) rim.push(idx(0, iz));
  rim.push(idx(0, 0));
  const sp = [];
  for (let k = 0; k < rim.length - 1; k++) {
    const a = rim[k], b = rim[k + 1];
    const ax = cx + pos.getX(a), ay = pos.getY(a) + 0.15, az = cz + pos.getZ(a);
    const bx = cx + pos.getX(b), by = pos.getY(b) + 0.15, bz = cz + pos.getZ(b);
    sp.push(ax, ay, az, bx, by, bz, ax, -1, az,
            bx, by, bz, bx, -1, bz, ax, -1, az);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(sp), 3));
  g.skirt = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({
    color: 0xa97e56, side: THREE.DoubleSide }));
  g.slab.add(g.skirt);
}

async function buildSlab(g) {
  const { lat0, lon0, kx, kz } = g.proj;
  // Padded bbox around the ride (25% of span, min 80 m).
  let lonW = Infinity, lonE = -Infinity, latS = Infinity, latN = -Infinity;
  for (const c of g.coords) {
    lonW = Math.min(lonW, c[0]); lonE = Math.max(lonE, c[0]);
    latS = Math.min(latS, c[1]); latN = Math.max(latN, c[1]);
  }
  const padLon = Math.max((lonE - lonW) * 0.25, 80 / kx);
  const padLat = Math.max((latN - latS) * 0.25, 80 / kz);
  lonW -= padLon; lonE += padLon; latS -= padLat; latN += padLat;

  let map;
  try { map = await mapCanvasForBbox(lonW, latS, lonE, latN); }
  catch { return; } // offline / blocked: keep the plain grid
  if (ride !== g) return; // a newer file was dropped while we fetched
  document.getElementById('attrib').innerHTML = map.attrib;
  const crop = map.canvas;

  const mapTex = new THREE.CanvasTexture(crop);
  mapTex.colorSpace = THREE.SRGBColorSpace;
  mapTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  g.mapTex = mapTex;

  // Real relief for the specimen: DEM for the same bbox (flat slab if it fails).
  let dem = null;
  try { dem = await fetchDem(lonW, latS, lonE, latN); } catch {}
  if (ride !== g) return;

  // World-space slab under the route (relief grows up from y = 0).
  const xW = (lonW - lon0) * kx, xE = (lonE - lon0) * kx;
  const zN = -(latN - lat0) * kz, zS = -(latS - lat0) * kz;
  const w = xE - xW, d = zS - zN;
  g.slabX = { xW, xE, zN, zS, w, d };
  if (dem) {
    const { data, nx, ny } = dem;
    g.demSample = (x, zc) => { // bilinear metres-above-slab-base
      const u = Math.min(1, Math.max(0, (x - xW) / w)) * (nx - 1);
      const v = Math.min(1, Math.max(0, (zc - zN) / d)) * (ny - 1);
      const x0 = Math.floor(u), y0 = Math.floor(v);
      const x1 = Math.min(nx - 1, x0 + 1), y1 = Math.min(ny - 1, y0 + 1);
      const fx = u - x0, fy = v - y0;
      const a = data[y0 * nx + x0] * (1 - fx) + data[y0 * nx + x1] * fx;
      const b = data[y1 * nx + x0] * (1 - fx) + data[y1 * nx + x1] * fx;
      return a * (1 - fy) + b * fy;
    };
  }

  const thick = Math.max(14, 0.06 * Math.max(w, d));
  const slab = new THREE.Group();
  const sides = new THREE.Mesh(
    new THREE.BoxGeometry(w, thick, d),
    new THREE.MeshBasicMaterial({ map: earthSideTexture() }));
  sides.position.set((xW + xE) / 2, -thick / 2, (zN + zS) / 2);
  slab.add(sides);
  scene.add(slab);
  g.slab = slab;

  refreshTerrain(g);   // heightfield (or flat) top
  rebuildGeometry();   // drape the route + curtain onto the relief

  grid.visible = false;
  document.getElementById('attrib').style.display = 'block';
  if (!follow) frameCamera();
}

function frameCamera() {
  const box = new THREE.Box3().setFromPoints(ride.drawn);
  if (ride.slab) box.union(new THREE.Box3().setFromObject(ride.slab));
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const d = Math.max(size.x, size.z, size.y) * 1.7 + 120;
  controls.target.copy(c);
  camera.position.set(c.x + d * 0.55, c.y + d * 0.7, c.z + d * 0.75);
  camera.near = d / 200; camera.far = d * 40; camera.updateProjectionMatrix();
}

// ---- Live terrain map mode: an interactive MapLibre map with real 3D
// terrain (hillshade + raster-dem + sky), the ride as a speed-gradient line.
// DEM: AWS/Mapzen terrarium tiles — global coverage, free, no API key.
let mapMode = false, liveMap = null;
const DEM = {
  type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 15,
  tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
  attribution: 'Terrain &copy; Mapzen/AWS Open Data',
};

// SVG markers for the live map: flags for start/finish, a bike for the head.
const FLAG_SVG = fill => `<svg viewBox="0 0 24 24" width="100%" height="100%">
  <path d="M5 21V4" stroke="#444" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 4h11l-2.8 4L17 12H6z" fill="${fill}"/></svg>`;
const CHECK_SVG = `<svg viewBox="0 0 24 24" width="100%" height="100%">

  <rect x="6" y="4" width="2.75" height="2.67" fill="#111"/><rect x="11.5" y="4" width="2.75" height="2.67" fill="#111"/>
  <rect x="8.75" y="6.67" width="2.75" height="2.67" fill="#111"/><rect x="14.25" y="6.67" width="2.75" height="2.67" fill="#111"/>
  <rect x="6" y="9.33" width="2.75" height="2.67" fill="#111"/><rect x="11.5" y="9.33" width="2.75" height="2.67" fill="#111"/></svg>`;
const BIKE_SVG = `<svg viewBox="0 0 24 24" width="100%" height="100%">
  <circle cx="12" cy="12" r="11.4" fill="#fff"/>
  <path fill="#fc5200" transform="translate(3.6,3.6) scale(0.7)" d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5S3.1 13.5 5 13.5 8.5 15.1 8.5 17 6.9 20.5 5 20.5zm5.8-10 2.4-2.4.8.8c1.3 1.3 3 2.1 5.1 2.1V9c-1.5 0-2.7-.6-3.6-1.5l-1.9-1.9c-.5-.4-1-.6-1.6-.6s-1.1.2-1.4.6L7.8 8.4c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 14v5h2v-6.2l-2.2-2.3zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/></svg>`;
function iconMarker(svg, size, anchor) {
  const d = document.createElement('div');
  d.style.cssText = `width:${size}px;height:${size}px;` +
    `filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));`;
  d.innerHTML = svg;
  return new maplibregl.Marker({ element: d, anchor });
}

// line-progress -> colour, sampled along cumulative distance (<= ~48 stops).
function gradientStops(g) {
  const expr = ['interpolate', ['linear'], ['line-progress']];
  const n = g.P.length, step = Math.max(1, Math.ceil(n / 48));
  const total = Math.max(1e-6, g.cumD[n - 1]);
  const tmp = new THREE.Color();
  let lastF = -1;
  for (let i = 0; i < n; i += step) {
    let f = g.cumD[i] / total;
    if (f <= lastF) f = lastF + 1e-4;
    if (f >= 1) break;
    lastF = f;
    speedColor(g.vNorm[i], tmp);
    expr.push(f, '#' + tmp.getHexString());
  }
  speedColor(g.vNorm[n - 1], tmp);
  expr.push(1, '#' + tmp.getHexString());
  return expr;
}

function ensureLiveMap() {
  if (liveMap || !ride) return;
  const g = ride;
  liveMap = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: { type: 'raster', tileSize: 256, maxzoom: 19,
               tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
               attribution: '&copy; OpenStreetMap contributors' },
        terrainSource: DEM,
        hillshadeSource: DEM,
      },
      layers: [
        { id: 'osm', type: 'raster', source: 'osm' },
        { id: 'hills', type: 'hillshade', source: 'hillshadeSource',
          layout: { visibility: 'visible' },
          paint: { 'hillshade-shadow-color': '#473B24' } },
      ],
      terrain: { source: 'terrainSource', exaggeration: 1 },
      sky: {},
    },
    maxZoom: 18,
    maxPitch: 85,
    center: [g.coords[0][0], g.coords[0][1]], // near the ride from frame one
    zoom: 13,
  });
  liveMap.addControl(new maplibregl.NavigationControl({
    visualizePitch: true, showZoom: true, showCompass: true }), 'bottom-right');
  liveMap.addControl(new maplibregl.TerrainControl({
    source: 'terrainSource', exaggeration: 1 }), 'bottom-right');

  liveMap.on('load', () => {
    const line = g.coords.map(c => [c[0], c[1]]);
    liveMap.addSource('route', { type: 'geojson', lineMetrics: true,
      data: { type: 'Feature', geometry: { type: 'LineString', coordinates: line } } });
    liveMap.addLayer({ id: 'route-casing', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#ffffff', 'line-width': 8, 'line-opacity': 0.9 } });
    liveMap.addLayer({ id: 'route', type: 'line', source: 'route',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-width': 4.5, 'line-gradient': gradientStops(g) } });
    g.mapStart = iconMarker(FLAG_SVG('#16a34a'), 30, 'bottom').setLngLat(line[0]).addTo(liveMap);
    g.mapEnd = iconMarker(CHECK_SVG, 30, 'bottom').setLngLat(line[line.length - 1]).addTo(liveMap);
    g.mapHead = iconMarker(BIKE_SVG, 26, 'center').setLngLat(line[0]).addTo(liveMap);
    const b = new maplibregl.LngLatBounds();
    for (const c of line) b.extend(c);
    // fitBounds' zoom math assumes pitch 0 — fit flat first, tilt after.
    try { liveMap.fitBounds(b, { padding: 90, duration: 0 }); } catch {}
    liveMap.easeTo({ pitch: 60, duration: 800 });
    setProgress(headT);
  });
}

function setMapMode(on) {
  mapMode = on;
  const btn = document.getElementById('viewtoggle');
  btn.classList.toggle('on', on);
  btn.textContent = on ? 'Model view' : 'Terrain map';
  document.getElementById('map').style.display = on ? 'block' : 'none';
  document.getElementById('reliefctl').style.display = on ? 'none' : 'flex';
  document.getElementById('hint').style.display = (!on && ride) ? 'block' : 'none';
  document.getElementById('attrib').style.display =
    (!on && ride?.slab) ? 'block' : 'none'; // the live map shows its own
}

// Reveal + head position, driven by time fraction 0..1.
function setProgress(frac) {
  const g = ride; if (!g) return;
  headT = Math.min(1, Math.max(0, frac));
  const seg = Math.max(1, Math.round(g.segCount * headT));
  g.route.geometry.instanceCount = seg;
  if (g.curtain) g.curtain.geometry.setDrawRange(0, seg * 6);

  const t = g.tMin + (g.tMax - g.tMin) * headT;
  document.getElementById('scrub').value = String(Math.round(headT * 1000));
  document.getElementById('clock').textContent = mmss(t);

  // Head marker exists only after the first full build.
  if (!g.head) return;
  let i = 1; while (i < g.tArr.length && g.tArr[i] < t) i++;
  const a = g.drawn[i - 1], b = g.drawn[Math.min(i, g.drawn.length - 1)];
  const ta = g.tArr[i - 1], tb = g.tArr[Math.min(i, g.tArr.length - 1)];
  const f = tb > ta ? (t - ta) / (tb - ta) : 0;
  const hp = a.clone().lerp(b, f);
  g.head.position.copy(hp);
  // Point the bike along the direction of travel.
  const dxw = b.x - a.x, dzw = b.z - a.z;
  if (Math.abs(dxw) + Math.abs(dzw) > 1e-6)
    g.head.rotation.y = Math.atan2(-dzw, dxw);

  if (follow && !mapMode) {
    const off = new THREE.Vector3(80, 120, 140);
    controls.target.lerp(hp, 0.12);
    camera.position.lerp(hp.clone().add(off), 0.08);
  }

  // Terrain-map mode: move the head marker; chase = fly the map camera along
  // the course with a tilted view.
  if (mapMode && liveMap && g.mapHead) {
    const ca = g.coords[i - 1], cb = g.coords[Math.min(i, g.coords.length - 1)];
    const lon = ca[0] + f * (cb[0] - ca[0]), lat = ca[1] + f * (cb[1] - ca[1]);
    g.mapHead.setLngLat([lon, lat]);
    if (follow) {
      const dx = (cb[0] - ca[0]) * Math.cos(lat * Math.PI / 180);
      const dy = cb[1] - ca[1];
      const opts = { center: [lon, lat], pitch: 65 };
      if (Math.abs(dx) + Math.abs(dy) > 1e-9)
        opts.bearing = Math.atan2(dx, dy) * 180 / Math.PI;
      liveMap.jumpTo(opts);
    }
  }
}

function mmss(s) {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function showChrome(sum, vMin, vMax) {
  document.getElementById('header').style.display = 'block';
  document.getElementById('legend').style.display = 'block';
  document.getElementById('transport').style.display = 'flex';
  document.getElementById('hint').style.display = 'block';
  const d = sum.ended_at ? new Date(sum.ended_at * 1000) : null;
  document.getElementById('date').textContent = d
    ? d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const set = (id, v) => document.getElementById(id).textContent = v;
  set('s-dist', (sum.dist_km ?? 0).toFixed(1));
  set('s-time', mmss(sum.moving_s ?? 0));
  set('s-avg', Math.round(sum.avg_kmh ?? 0));
  set('s-max', Math.round(sum.max_kmh ?? 0));
  set('s-elev', Math.round(climb(ride.P)));
  set('s-hr', sum.has_hr ? Math.round(sum.avg_hr) : '--');
  set('lg-min', Math.round(vMin)); set('lg-max', Math.round(vMax));
}

function climb(P) { // positive vertical steps (raw metres, pre-exaggeration)
  let g = 0;
  for (let i = 1; i < P.length; i++) { const d = P[i].y - P[i - 1].y; if (d > 0.3) g += d; }
  return g;
}

// ---- loading ----
function loadText(txt) {
  document.getElementById('err').textContent = '';
  try {
    buildRide(JSON.parse(txt));
    document.getElementById('drop').classList.add('hide');
    playing = true; setPlayIcon();
  } catch (e) {
    document.getElementById('err').textContent = 'Could not read the file: ' + e.message;
  }
}
function loadFile(file) {
  const r = new FileReader();
  r.onload = () => loadText(String(r.result));
  r.readAsText(file);
}

// ---- interaction ----
const drop = document.getElementById('drop'), fileInput = document.getElementById('file');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', e => { if (e.target === document.body) document.body.classList.remove('dragging'); });
addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0]; if (f) loadFile(f);
});

function setPlayIcon() {
  document.getElementById('play').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
}
document.getElementById('play').addEventListener('click', () => {
  if (!ride) return;
  if (headT >= 1) headT = 0; // replay from the start
  playing = !playing; setPlayIcon();
});
document.getElementById('scrub').addEventListener('input', e => {
  playing = false; setPlayIcon();
  setProgress(Number(e.target.value) / 1000);
});
document.getElementById('follow').addEventListener('click', e => {
  follow = !follow; e.target.classList.toggle('on', follow);
  if (!follow && ride) frameCamera();
});
document.getElementById('viewtoggle').addEventListener('click', async () => {
  if (!ride) return;
  if (!mapMode) {
    try { await loadMapLibre(); } catch { return; } // offline: stay in model view
    setMapMode(true);
    ensureLiveMap();
    liveMap?.resize();
  } else {
    setMapMode(false);
  }
});
document.getElementById('exag').addEventListener('input', e => {
  exag = Number(e.target.value);
  if (ride) { rebuildGeometry(); if (ride.demSample) refreshTerrain(ride); }
});

// ---- loop ----
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (ride && playing) {
    const dur = Math.max(4, (ride.tMax - ride.tMin) / 6); // ~6x real time, min 4s
    headT += dt / dur;
    if (headT >= 1) { headT = 1; playing = false; setPlayIcon(); }
    setProgress(headT);
  }
  if (!mapMode) { // the live map renders itself; don't burn GPU behind it
    controls.update();
    renderer.render(scene, camera);
  }
}
requestAnimationFrame(animate);

function resize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (ride?.mat) ride.mat.resolution.set(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();
</script>
</body>
