<!DOCTYPE html>
<html lang="en" class="h-[100dvh]">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ride Viewer</title>
<!--
  Standalone Three.js viewer for a cyclomp ride export. Drag a .geojson
  produced by the app's EXPORT button onto the window (or click to pick one).
  Clean light theme: the route is drawn in 3D with elevation as height and an
  "elevation curtain" down to the ground; colour encodes speed on a single-hue
  orange ramp (slow = light, fast = deep). Fly-through reveal, chase cam,
  scrub timeline, stat row. No build step; serve this folder and open it
  (needs internet once for the Three.js CDN).
-->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      ink: '#242428', muted: '#6d6d78', faint: '#9a9aa5', bd: '#e6e6eb',
      card: '#ffffff', canvas: '#f5f6f8', accent: '#fc5200', accentd: '#d94700',
      start: '#16a34a', finish: '#dc2626',
    },
    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"',
      'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'] },
    boxShadow: { card: '0 1px 3px rgba(20,20,30,.08), 0 4px 16px rgba(20,20,30,.08)' },
  } } };
</script>
<style type="text/tailwindcss">
  /* Only what utility classes can't express statically: gradients, the range
     accent, and the JS-toggled .on / .hide / .dragging states. */
  canvas { display: block; touch-action: none; }
  /* Horizontal scroll strips (header stats, phone pill row) without a visible
     scrollbar — the content is self-evidently swipeable. */
  .no-sb { -ms-overflow-style: none; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .no-sb::-webkit-scrollbar { display: none; }
  /* Comfortable touch targets for the range sliders on a phone. */
  @media (pointer: coarse) {
    #scrub, #exag { height: 22px; }
  }
  .hide { display: none !important; }
  #vignette { background: radial-gradient(ellipse 75% 65% at 50% 42%,
    rgba(0,0,0,0) 55%, rgba(28,32,44,.055) 78%, rgba(28,32,44,.13) 100%); }
  #legendbar { background: linear-gradient(90deg, #fcd0ae, #fc5200, #8f2d00); }
  #scrub, #exag { accent-color: #fc5200; height: 4px; cursor: pointer; }
  #viewmodes button.on, .pill.on { background: #fc5200; border-color: #fc5200; color: #fff; }
  body.dragging #dropwell { border-color: #fc5200; background: #fff7f2; }
</style>
</head>
<body class="h-[100dvh] m-0 overflow-hidden font-sans text-ink bg-canvas">
<div id="app" class="fixed inset-0"></div>
<div id="vignette" class="fixed inset-0 pointer-events-none z-[1]"></div>

<header id="header" style="display:none"
  class="fixed top-0 inset-x-0 z-[3] bg-white/80 backdrop-blur-md backdrop-saturate-150
         border-b border-bd shadow-[0_6px_20px_rgba(20,20,30,.05)]">
  <div class="w-full px-3 sm:px-6 py-2 sm:py-2.5 flex items-center gap-3 sm:gap-5 flex-wrap">
    <div class="flex items-center gap-2.5 sm:gap-3 min-w-0 shrink-0">
      <span class="w-[4px] sm:w-[5px] h-[26px] sm:h-[30px] rounded-[3px] shrink-0 bg-gradient-to-b from-accent to-accentd"></span>
      <div class="min-w-0">
        <h1 class="text-[13.5px] sm:text-[15px] font-bold tracking-tight leading-tight m-0 truncate">Ride Viewer</h1>
        <span id="date" class="block text-muted text-[11px] sm:text-[11.5px] mt-px tabular-nums truncate"></span>
      </div>
    </div>

    <div id="viewmodes" style="display:none"
      class="order-3 sm:order-none w-full sm:w-auto overflow-x-auto no-sb mx-auto shrink-0 flex items-center bg-canvas border border-bd rounded-full p-[3px] gap-[2px]">
      <button data-mode="map" class="on text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Map</button>
      <button data-mode="hybrid" class="text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Map&nbsp;+&nbsp;Elev</button>
      <button data-mode="grid" class="text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Grid</button>
      <button data-mode="template" class="text-xs font-semibold text-muted rounded-full px-[13px] py-[6px] leading-none whitespace-nowrap transition hover:text-ink">Elevation</button>
    </div>

    <!-- min-w-0 + shrinkable: the six cells are wider than a phone, so this
         box must be allowed to narrow and scroll internally rather than force
         the header wider than the viewport. -->
    <div class="flex items-stretch ml-auto min-w-0 max-w-full overflow-x-auto no-sb">
      <div class="px-2.5 sm:px-4 py-0.5 shrink-0">
        <div class="text-[17px] sm:text-[21px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap text-accent"><span id="s-dist">0.0</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">km</i></div>
        <div class="text-[9px] sm:text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold whitespace-nowrap">Distance</div>
      </div>
      <div class="px-2.5 sm:px-4 py-0.5 shrink-0 border-l border-bd">
        <div class="text-[17px] sm:text-[21px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-time">0:00</span></div>
        <div class="text-[9px] sm:text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold whitespace-nowrap">Moving Time</div>
      </div>
      <div class="px-2.5 sm:px-4 py-0.5 shrink-0 border-l border-bd">
        <div class="text-[17px] sm:text-[21px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-avg">0</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">km/h</i></div>
        <div class="text-[9px] sm:text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold whitespace-nowrap">Avg Speed</div>
      </div>
      <div class="px-2.5 sm:px-4 py-0.5 shrink-0 border-l border-bd">
        <div class="text-[17px] sm:text-[21px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-max">0</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">km/h</i></div>
        <div class="text-[9px] sm:text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold whitespace-nowrap">Max Speed</div>
      </div>
      <div class="px-2.5 sm:px-4 py-0.5 shrink-0 border-l border-bd">
        <div class="text-[17px] sm:text-[21px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-elev">0</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">m</i></div>
        <div class="text-[9px] sm:text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold whitespace-nowrap">Elev Gain</div>
      </div>
      <div class="px-2.5 sm:px-4 py-0.5 shrink-0 border-l border-bd">
        <div class="text-[17px] sm:text-[21px] font-semibold tracking-tight tabular-nums leading-tight whitespace-nowrap"><span id="s-hr">--</span><i class="not-italic text-xs font-semibold text-muted ml-[3px]">bpm</i></div>
        <div class="text-[9px] sm:text-[10.5px] text-faint uppercase tracking-wide mt-[3px] font-semibold whitespace-nowrap">Avg HR</div>
      </div>
    </div>
  </div>
</header>

<div id="legend" style="display:none"
  class="fixed left-3 sm:left-6 bottom-[136px] sm:bottom-[104px] z-[3] w-[150px] sm:w-[200px] bg-card border border-bd rounded-[10px] shadow-card px-2.5 sm:px-[14px] py-2 sm:py-[10px]">
  <div class="text-[11px] text-muted uppercase tracking-wide mb-1.5">Speed</div>
  <div id="legendbar" class="h-2 rounded"></div>
  <div class="flex justify-between text-muted text-[11px] mt-1 tabular-nums">
    <span id="lg-min">0</span><span>km/h</span><span id="lg-max">0</span></div>
</div>

<div id="hint" style="display:none"
  class="hidden sm:block fixed right-6 bottom-[104px] z-[3] bg-card border border-bd rounded-[10px] shadow-card text-muted text-[11.5px] px-3 py-2">Drag to orbit &nbsp;·&nbsp; scroll to zoom</div>
<div id="attrib" style="display:none"
  class="fixed right-3 sm:right-6 bottom-[136px] sm:bottom-[74px] z-[3] bg-white/85 border border-bd rounded-md text-faint text-[10px] px-2 py-[3px] [&_a]:text-muted [&_a]:no-underline"></div>

<!-- Phone: two rows inside one rounded card (transport, then a scrollable pill
     strip). Desktop (sm+): the original single row. -->
<div id="transport" style="display:none"
  class="fixed left-1/2 -translate-x-1/2 bottom-3 sm:bottom-6 z-[3]
         w-[calc(100%-16px)] sm:w-[min(720px,calc(100%-48px))]
         flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-[14px]
         bg-card border border-bd rounded-2xl sm:rounded-full shadow-card
         px-2 sm:pl-[10px] sm:pr-[18px] py-2 sm:py-[10px]">
  <div class="flex items-center gap-3 sm:contents">
    <button id="play" aria-label="Play"
      class="w-11 h-11 shrink-0 rounded-full bg-accent hover:bg-accentd text-white text-[15px]
             grid place-items-center transition-colors">&#9654;</button>
    <input id="scrub" type="range" min="0" max="1000" value="1000" class="flex-1 min-w-0" />
    <span id="clock" class="text-ink text-sm font-semibold min-w-[48px] sm:min-w-[52px] text-right tabular-nums">0:00</span>
  </div>
  <div class="flex items-center gap-2 sm:gap-[14px] overflow-x-auto no-sb sm:contents">
    <button id="speed" title="Playback speed"
      class="pill shrink-0 text-[12.5px] font-semibold text-muted border border-bd rounded-full px-[13px] py-[7px]
             min-w-[54px] tabular-nums whitespace-nowrap transition hover:border-faint hover:text-ink">6&times;</button>
    <button id="follow"
      class="pill shrink-0 text-[12.5px] font-semibold text-muted border border-bd rounded-full px-[13px] py-[7px]
             whitespace-nowrap transition hover:border-faint hover:text-ink">Chase cam</button>
    <button id="meteors" title="Meteor shower ahead of the rider"
      class="pill on shrink-0 text-[12.5px] font-semibold text-muted border border-bd rounded-full px-[13px] py-[7px]
             whitespace-nowrap transition hover:border-faint hover:text-ink">Meteors</button>
    <button id="zombies" title="Zombie horde chasing the rider"
      class="pill on shrink-0 text-[12.5px] font-semibold text-muted border border-bd rounded-full px-[13px] py-[7px]
             whitespace-nowrap transition hover:border-faint hover:text-ink">Zombies</button>
    <button id="maung" title="Maung convoy on the rider's tail"
      class="pill on shrink-0 text-[12.5px] font-semibold text-muted border border-bd rounded-full px-[13px] py-[7px]
             whitespace-nowrap transition hover:border-faint hover:text-ink">Maung</button>
    <span id="reliefctl" class="flex shrink-0 items-center gap-[7px] text-muted text-[11.5px] font-semibold uppercase tracking-wide whitespace-nowrap">
      Relief <input id="exag" type="range" min="0" max="40" value="12" class="w-16 sm:w-20" /></span>
  </div>
</div>

<div id="drop"
  class="fixed inset-0 z-[5] flex items-center justify-center bg-canvas/95 cursor-pointer">
  <div class="bg-card border border-bd rounded-2xl shadow-card mx-4 px-6 sm:px-14 py-8 sm:py-11 text-center max-w-[460px]">
    <div id="dropwell" class="border-2 border-dashed border-bd rounded-xl px-4 sm:px-7 py-6 sm:py-8 transition">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        class="w-11 h-11 stroke-accent mb-2.5 mx-auto">
        <path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
      </svg>
      <div class="text-[17px] sm:text-[19px] font-bold tracking-tight">Upload your ride</div>
      <div class="text-muted text-[12.5px] sm:text-[13.5px] leading-relaxed mt-2">Drop the
        <code class="bg-canvas border border-bd rounded px-1.5 text-xs">.geojson</code> here, or click to browse.<br/>
        Export one from cyclomp: <strong>Log&nbsp;→ open a ride&nbsp;→ Export</strong>.</div>
      <div id="err" class="text-finish text-[13px] min-h-[18px] mt-2.5 font-medium"></div>
    </div>
  </div>
  <input id="file" type="file" accept=".geojson,.json,application/geo+json" class="hidden" />
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const COL = {
  bg: 0xeef0f3, grid: 0xd7dce2, grid2: 0xe4e8ed,
  rampLo: 0xfcd0ae, accent: 0xfc5200, rampHi: 0x8f2d00,
  start: 0x16a34a, finish: 0xdc2626, white: 0xffffff,
};

// ---- scene ----
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
// Phones ship DPR 3; rendering the meteor field and the map slab at 3x eats
// the frame budget for no visible gain, so cap harder on touch devices.
const COARSE = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio, COARSE ? 1.75 : 2));
app.appendChild(renderer.domElement);
// Safety net: MapLibre adds a second WebGL context, and a stressed browser
// can drop ours. Ask for it back rather than going blank.
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  setTimeout(() => renderer.forceContextRestore(), 200);
}, false);

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.bg);
// Range is set from the ride's own size in frameCamera() — fixed distances
// fogged a multi-kilometre ride out completely.
scene.fog = new THREE.Fog(0xf4f6f7, 1e6, 2e6); // matched to the horizon band

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 20000);
camera.position.set(300, 320, 480);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495; // stay above the ground
// Refresh the map detail LOD after the user stops dragging/zooming.
controls.addEventListener('end', () => scheduleDetail());

// Ground grid.
const grid = new THREE.GridHelper(4000, 80, COL.grid, COL.grid2);
grid.material.transparent = true; grid.material.opacity = 0.9;
scene.add(grid);

// No lights anywhere: every material is unlit (MeshBasicMaterial), and the
// terrain's relief shading is baked into vertex colours (see refreshTerrain).
// That keeps the draped map at its true colours and sidesteps three's
// r155+ physical-light-units migration entirely.

// ---- backdrop: a soft studio gradient dome ----
// An inverted sphere pinned to the camera, so it can never be clipped by the
// far plane or orbited "out of". fog: false keeps the haze off the sky
// itself; its scale is set from the ride's size in frameCamera().
function skyTexture() {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const x = c.getContext('2d');
  const grad = x.createLinearGradient(0, 0, 0, 256);
  // Light studio backdrop — the mat green belongs to the floor, not the air.
  grad.addColorStop(0.00, '#d7e0e6'); // zenith, cool
  grad.addColorStop(0.42, '#e9eef1');
  grad.addColorStop(0.60, '#f8f9fa'); // horizon glow
  grad.addColorStop(0.78, '#eceef0');
  grad.addColorStop(1.00, '#dfe3e6'); // below the horizon
  x.fillStyle = grad; x.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1, 32, 20),
  new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide,
                                fog: false, depthWrite: false }));
sky.renderOrder = -1;
sky.scale.setScalar(5000);
scene.add(sky);

// Soft contact shadow under the block — it reads as a solid object sitting
// in a space instead of a slab hanging in a void. The camera is clamped
// above the horizon (maxPolarAngle), so it is never seen from underneath.
function shadowTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  // Tighter core than a plain radial falloff: mostly solid under the block,
  // then a quick soft edge, so it reads as contact rather than a grey haze.
  const grad = x.createRadialGradient(s / 2, s / 2, s * 0.05, s / 2, s / 2, s / 2);
  grad.addColorStop(0.00, 'rgba(22,27,40,0.55)');
  grad.addColorStop(0.38, 'rgba(22,27,40,0.40)');
  grad.addColorStop(0.62, 'rgba(22,27,40,0.16)');
  grad.addColorStop(0.82, 'rgba(22,27,40,0.04)');
  grad.addColorStop(1.00, 'rgba(22,27,40,0)');
  x.fillStyle = grad; x.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
let _shadowTex = null;
const shadowTex = () => _shadowTex || (_shadowTex = shadowTexture());

// Technical grid the specimen is presented on: fine cells with a heavier
// line every eighth, faded out radially so the plane has no visible edge.
// The falloff is baked into the texture's alpha (destination-in), which
// avoids a second transparent mask plane.
function gridTexture() {
  const s = 1024, cells = 32, step = s / cells;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const line = (every, style, width) => {
    x.strokeStyle = style; x.lineWidth = width;
    x.beginPath();
    for (let i = 0; i <= cells; i += every) {
      const p = Math.round(i * step) + 0.5;
      x.moveTo(p, 0); x.lineTo(p, s);
      x.moveTo(0, p); x.lineTo(s, p);
    }
    x.stroke();
  };
  // Plain technical grid: lines only, no filled field.
  line(1, 'rgba(120,134,158,0.18)', 1);  // minor
  line(8, 'rgba(92,108,134,0.34)', 2);   // major
  // Long, gradual falloff — a short one showed up as a hard dark disc sitting
  // on the light backdrop. Starts easing almost immediately and never has a
  // visible rim.
  const fade = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  fade.addColorStop(0.00, 'rgba(0,0,0,0.78)');
  fade.addColorStop(0.22, 'rgba(0,0,0,0.66)');
  fade.addColorStop(0.42, 'rgba(0,0,0,0.46)');
  fade.addColorStop(0.60, 'rgba(0,0,0,0.26)');
  fade.addColorStop(0.76, 'rgba(0,0,0,0.11)');
  fade.addColorStop(0.90, 'rgba(0,0,0,0.03)');
  fade.addColorStop(1.00, 'rgba(0,0,0,0)');
  x.globalCompositeOperation = 'destination-in';
  x.fillStyle = fade; x.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
let _gridTex = null;
const gridTex = () => _gridTex || (_gridTex = gridTexture());

// ---- ride state ----
let ride = null;
let playing = false, headT = 1, follow = false, exag = 12;

function disposeObj(o) {
  if (!o) return;
  scene.remove(o);
  o.geometry?.dispose?.(); o.material?.dispose?.();
  o.children?.slice().forEach(disposeObj);
}
function clearRide() {
  if (!ride) return;
  for (const o of [ride.route, ride.curtain, ride.head, ride.startDot,
                   ride.endDot, ride.terrain, ride.wire, ride.skirt, ride.cap,
                   ride.shadow, ride.base, ride.detail, ride.slab,
                   ride.meteors, ride.zombies, ride.maung])
    disposeObj(o);
  grid.visible = true;
  document.getElementById('attrib').style.display = 'none';
  viewMode = 'map'; // each new ride opens in Map view
  ride = null;
}

// Single-hue orange ramp: slow = light, fast = deep.
const c1 = new THREE.Color(COL.rampLo), c2 = new THREE.Color(COL.accent),
      c3 = new THREE.Color(COL.rampHi);
function speedColor(v, out) {
  if (v < 0.5) out.copy(c1).lerp(c2, v / 0.5);
  else out.copy(c2).lerp(c3, (v - 0.5) / 0.5);
  return out;
}

function project(coords) {
  // Equirectangular metres around the centroid; north = -Z, up = +Y.
  // Returns the projection constants too — the map slab reuses them.
  let lat0 = 0, lon0 = 0;
  for (const c of coords) { lon0 += c[0]; lat0 += c[1]; }
  lon0 /= coords.length; lat0 /= coords.length;
  const kx = Math.cos(lat0 * Math.PI / 180) * 111320, kz = 110540;
  let altMin = Infinity;
  for (const c of coords) altMin = Math.min(altMin, c[2] ?? 0);
  const pts = coords.map(c => new THREE.Vector3(
    (c[0] - lon0) * kx, ((c[2] ?? 0) - altMin), -(c[1] - lat0) * kz));
  return { pts, lat0, lon0, kx, kz };
}

// Start / finish: a little flag on a pole (finish gets a checker texture).
function makeFlag(color, checkered = false) {
  const gp = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 24, 8),
    new THREE.MeshBasicMaterial({ color: 0x6b6b74 }));
  pole.position.y = 12;
  gp.add(pole);
  let mat;
  if (checkered) {
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const x = c.getContext('2d');
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      x.fillStyle = (i + j) % 2 ? '#17171b' : '#ffffff';
      x.fillRect(i * 8, j * 8, 8, 8);
    }
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    mat = new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide });
  } else {
    mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  }
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(13, 8), mat);
  flag.position.set(6.9, 19.5, 0);
  gp.add(flag);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2, 3, 1.6, 10),
    new THREE.MeshBasicMaterial({ color: 0x55555e }));
  base.position.y = 0.8;
  gp.add(base);
  scene.add(gp);
  return gp;
}

// Current position: a low-poly bike built from primitives, facing +X.
function makeBike() {
  const g = new THREE.Group();
  // Unlit, so tubes get slightly different tones to keep the form readable.
  const frame = new THREE.MeshBasicMaterial({ color: COL.accent });
  const frameLo = new THREE.MeshBasicMaterial({ color: 0xc43f00 });
  const dark = new THREE.MeshBasicMaterial({ color: 0x2b2b31 });
  const wheelG = new THREE.TorusGeometry(4, 0.8, 6, 14);
  const w1 = new THREE.Mesh(wheelG, dark); w1.position.set(-5.5, 4, 0); g.add(w1);
  const w2 = new THREE.Mesh(wheelG, dark); w2.position.set(5.5, 4, 0); g.add(w2);
  const tube = (ax, ay, bx, by, mat, r = 0.7) => {
    const a = new THREE.Vector3(ax, ay, 0), b = new THREE.Vector3(bx, by, 0);
    const d = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 6), mat);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize());
    g.add(m);
  };
  tube(-5.5, 4, -1.2, 9.2, frameLo); // seat stay
  tube(-5.5, 4, 1.5, 3.6, frameLo);  // chain stay
  tube(1.5, 3.6, -1.2, 9.2, frame);  // seat tube
  tube(1.5, 3.6, 4.6, 9.2, frame);   // down tube
  tube(-1.2, 9.2, 4.6, 9.2, frame);  // top tube
  tube(4.6, 9.2, 5.5, 4, frameLo);   // fork
  const saddle = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.9, 1.5), dark);
  saddle.position.set(-1.6, 10, 0); g.add(saddle);
  const bars = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 5.2), dark);
  bars.position.set(4.6, 10, 0); g.add(bars);
  scene.add(g);
  return g;
}

// ---- Meteor shower --------------------------------------------------------
// Apocalypse garnish: small low-poly rocks rain down AHEAD of the bike, each
// dragging a fire trail and leaving smoke, as if the rider is outrunning a
// disaster. Everything is a fixed pool built once per ride and recycled —
// nothing is allocated inside the frame loop. Unlit like the rest of the
// scene: the rock's facets are baked into vertex colours, fire and smoke are
// point sprites coloured on the CPU. NB the fire is alpha-blended, not
// additive: additive light on this near-white sky/paper map just saturates
// to white and vanishes.
// Every distance here is in bike units (ride.mScale), so the effect reads
// the same on a city loop and on a 40 km ride.
const METEOR = {
  pool: 7,               // rocks airborne at once (hard cap)
  rate: 1.6,             // spawns per second while playing
  idleRate: 0.3,         // ... while paused: a drizzle keeps the scene alive
  ahead: [22, 75],       // impact distance ahead of the bike (bike units)
  lateral: 32,           // +/- sideways scatter of the impact point
  height: 110,           // entry altitude above the impact point
  fallTime: [1.1, 1.7],  // seconds from entry to impact
  rock: [1.3, 2.6],      // rock radius range (bike wheel radius is 4)
  fireStep: 2.4,         // one fire sprite every N units of travel...
  fireLife: 0.34,        // ...alive this long: trail length = speed x life
  smokeStep: 5.5,
  smokeLife: 1.5,
  fireCap: 256, smokeCap: 320, // ring buffers; the oldest puff is overwritten
};
let meteorsOn = true;

// Soft round sprite. Fire gets a solid hot core with a quick falloff, smoke a
// gentle one all the way out. Alpha-only: the colour comes per particle.
function puffTexture(hard) {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const grad = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  if (hard) {
    grad.addColorStop(0.00, 'rgba(255,255,255,1)');
    grad.addColorStop(0.25, 'rgba(255,255,255,0.85)');
    grad.addColorStop(0.60, 'rgba(255,255,255,0.25)');
    grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  } else {
    grad.addColorStop(0.00, 'rgba(255,255,255,0.7)');
    grad.addColorStop(0.50, 'rgba(255,255,255,0.3)');
    grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  }
  x.fillStyle = grad; x.fillRect(0, 0, s, s);
  return new THREE.CanvasTexture(c);
}
let _fireTex = null, _smokeTex = null;
const fireTex = () => _fireTex || (_fireTex = puffTexture(true));
const smokeTex = () => _smokeTex || (_smokeTex = puffTexture(false));

// Point sprites with a per-particle world size. PointsMaterial's size is
// per-material, so a tiny shader instead: aSize is a WORLD diameter, and
// uScale (set in resize) turns it into device pixels at 1 m — the fov is
// folded in, which three's own scale uniform ignores. Capped because some
// GPUs clamp gl_PointSize hard and a close smoke puff would otherwise pop.
const meteorScale = { value: 1 };
const PUFF_VS = `
  attribute float aSize; attribute vec3 aColor; attribute float aAlpha;
  uniform float uScale;
  varying vec3 vColor; varying float vAlpha;
  void main() {
    vColor = aColor; vAlpha = aAlpha;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = min(384.0, aSize * uScale / max(1.0, -mv.z));
    gl_Position = projectionMatrix * mv;
  }`;
const PUFF_FS = `
  uniform sampler2D uMap;
  varying vec3 vColor; varying float vAlpha;
  void main() {
    float a = texture2D(uMap, gl_PointCoord).a * vAlpha;
    if (a < 0.004) discard;
    gl_FragColor = vec4(vColor, a);
  }`;

// A ring buffer of sprites. Parallel typed arrays hold the simulation state;
// dead particles simply have size 0 (age >= life), so no compaction is
// needed and the draw call never changes shape.
function makePuffPool(cap, map) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(cap * 3), col = new Float32Array(cap * 3);
  const size = new Float32Array(cap), alpha = new Float32Array(cap);
  const dyn = a => a.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', dyn(new THREE.BufferAttribute(pos, 3)));
  geo.setAttribute('aColor', dyn(new THREE.BufferAttribute(col, 3)));
  geo.setAttribute('aSize', dyn(new THREE.BufferAttribute(size, 1)));
  geo.setAttribute('aAlpha', dyn(new THREE.BufferAttribute(alpha, 1)));
  const mat = new THREE.ShaderMaterial({
    vertexShader: PUFF_VS, fragmentShader: PUFF_FS,
    uniforms: { uMap: { value: map }, uScale: meteorScale },
    transparent: true, depthWrite: false, blending: THREE.NormalBlending });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false; // the bounding sphere would be stale every frame
  points.renderOrder = 3;       // over the curtain and the detail patch
  return { points, geo, cap, head: 0, pos, col, size, alpha,
           age: new Float32Array(cap), life: new Float32Array(cap),
           vel: new Float32Array(cap * 3), s0: new Float32Array(cap),
           s1: new Float32Array(cap), kind: new Uint8Array(cap) };
}
function emitPuff(p, x, y, z, vx, vy, vz, life, s0, s1, kind) {
  const i = p.head; p.head = (p.head + 1) % p.cap;
  p.pos[i * 3] = x; p.pos[i * 3 + 1] = y; p.pos[i * 3 + 2] = z;
  p.vel[i * 3] = vx; p.vel[i * 3 + 1] = vy; p.vel[i * 3 + 2] = vz;
  p.age[i] = 0; p.life[i] = life; p.s0[i] = s0; p.s1[i] = s1; p.kind[i] = kind;
}
// Colour ramps by particle kind, k = 0..1 through its life. Written straight
// into the attribute (sRGB-ish values: the shader does no conversion).
const lerp3 = (out, i, a, b, k) => {
  out[i] = a[0] + (b[0] - a[0]) * k;
  out[i + 1] = a[1] + (b[1] - a[1]) * k;
  out[i + 2] = a[2] + (b[2] - a[2]) * k;
};
const RAMP = {
  fireHot: [1.0, 0.92, 0.55], fireMid: [1.0, 0.42, 0.05], fireEnd: [0.5, 0.08, 0.02],
  flashA: [1.0, 0.95, 0.70], flashB: [1.0, 0.40, 0.05],
  smokeA: [0.38, 0.36, 0.40], smokeB: [0.66, 0.65, 0.68],
  dustA: [0.55, 0.48, 0.42], dustB: [0.74, 0.70, 0.66],
};
function puffColor(p, i, kind, k) {
  const c = i * 3;
  if (kind === 0) {        // fire trail: hot core -> orange -> deep red, dies fast
    if (k < 0.3) lerp3(p.col, c, RAMP.fireHot, RAMP.fireMid, k / 0.3);
    else lerp3(p.col, c, RAMP.fireMid, RAMP.fireEnd, (k - 0.3) / 0.7);
    p.alpha[i] = 0.95 * (1 - k);
  } else if (kind === 1) { // impact flash
    lerp3(p.col, c, RAMP.flashA, RAMP.flashB, k);
    p.alpha[i] = 0.9 * (1 - k) * (1 - k);
  } else if (kind === 2) { // smoke: fades in quick, lingers, thins out
    lerp3(p.col, c, RAMP.smokeA, RAMP.smokeB, k);
    p.alpha[i] = 0.45 * Math.min(1, k * 6) * (1 - k);

    lerp3(p.col, c, RAMP.dustA, RAMP.dustB, k);

function updatePuffs(p, dt) {
  for (let i = 0; i < p.cap; i++) {
    if (p.age[i] >= p.life[i]) { p.size[i] = 0; p.alpha[i] = 0; continue; }
    p.age[i] += dt;
    const k = Math.min(1, p.age[i] / p.life[i]);
    p.pos[i * 3] += p.vel[i * 3] * dt;
    p.pos[i * 3 + 1] += p.vel[i * 3 + 1] * dt;
    p.pos[i * 3 + 2] += p.vel[i * 3 + 2] * dt;
    p.size[i] = p.s0[i] + (p.s1[i] - p.s0[i]) * k;
    puffColor(p, i, p.kind[i], k);
  }

    p.geo.attributes[a].needsUpdate = true;

// Chunky rock: a plain icosahedron (12 facets, non-indexed so every face owns
// its vertices) with the shading baked into vertex colours — a key-light
// term for form, plus an orange bloom on faces pointing down, the side that
// ploughs through the air. It tumbles, so the glow flickers across facets,
// which happens to read as heat.
function rockGeometry() {
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const n = geo.attributes.normal, col = new Float32Array(n.count * 3);
  const L = new THREE.Vector3(0.4, 0.85, 0.3).normalize();
  const dark = new THREE.Color(0x2e2a30), lit = new THREE.Color(0x76696e);
  const hot = new THREE.Color(COL.accent);
  const tmp = new THREE.Color(), nv = new THREE.Vector3();
  for (let i = 0; i < n.count; i++) {
    nv.set(n.getX(i), n.getY(i), n.getZ(i));
    tmp.copy(dark).lerp(lit, Math.max(0, nv.dot(L)));
    tmp.lerp(hot, Math.max(0, -nv.y) * 0.6);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

function makeMeteorField(g) {
  const grp = new THREE.Group();
  const rockGeo = rockGeometry();
  const rockMat = new THREE.MeshBasicMaterial({ vertexColors: true });
  const rocks = [];
  for (let i = 0; i < METEOR.pool; i++) {
    const mesh = new THREE.Mesh(rockGeo, rockMat);
    mesh.visible = false;
    grp.add(mesh);
    rocks.push({ mesh, live: false, t: 0, dur: 0, r: 0, grav: 0,
                 pos: new THREE.Vector3(), vel: new THREE.Vector3(),
                 last: new THREE.Vector3(), spin: new THREE.Vector3(),
                 fireAcc: 0, smokeAcc: 0 });
  }
  const fire = makePuffPool(METEOR.fireCap, fireTex());
  const smoke = makePuffPool(METEOR.smokeCap, smokeTex());
  grp.add(fire.points, smoke.points);
  scene.add(grp);
  grp.sim = { u: g.mScale, rocks, fire, smoke, spawnIn: 0.4, cleared: false };
  return grp;
}

const rnd = (a, b) => a + Math.random() * (b - a);
// Where the ground is under (x, z): the relief surface when the slab has a
// DEM, else the flat grid. Elevation view floats the route over the bare
// grid, so the ground is y=0 there whatever the DEM says.
function groundY(g, x, z) {
  return (viewMode !== 'template' && g.demSample) ? g.demSample(x, z) * exagT() : 0;
}

function spawnMeteor(g, sim, rk) {
  const u = sim.u, hp = g.headPos, ry = g.head.rotation.y;
  // The bike model faces +X and is yawed by rotation.y, so its heading is
  // (cos ry, 0, -sin ry) — the same atan2(-dz, dx) setProgress derives it from.
  const fx = Math.cos(ry), fz = -Math.sin(ry);
  const ahead = rnd(METEOR.ahead[0], METEOR.ahead[1]) * u;
  const lat = rnd(-1, 1) * METEOR.lateral * u;
  const tx = hp.x + fx * ahead - fz * lat, tz = hp.z + fz * ahead + fx * lat;
  const ty = groundY(g, tx, tz);
  // Entry point is up and BEHIND the rider along the heading (with some
  // angular spread), so every meteor visibly overtakes the bike on its way
  // down — that is what sells "fleeing" rather than "being shelled".
  const h = METEOR.height * u, back = h * rnd(0.35, 0.8), ang = rnd(-0.5, 0.5);
  const bx = fx * Math.cos(ang) + fz * Math.sin(ang);
  const bz = -fx * Math.sin(ang) + fz * Math.cos(ang);
  const dur = rnd(METEOR.fallTime[0], METEOR.fallTime[1]);
  rk.pos.set(tx - bx * back, ty + h, tz - bz * back);
  // Mild gravity for a visible arc; the launch velocity is solved so the
  // rock still lands on the chosen spot after `dur` seconds.
  rk.grav = 0.5 * h / (dur * dur);
  rk.vel.set((tx - rk.pos.x) / dur, -h / dur + 0.5 * rk.grav * dur, (tz - rk.pos.z) / dur);
  rk.r = rnd(METEOR.rock[0], METEOR.rock[1]) * u;
  rk.mesh.scale.set(rk.r * rnd(0.8, 1.25), rk.r * rnd(0.7, 1.1), rk.r * rnd(0.8, 1.25));
  rk.mesh.rotation.set(rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28));
  rk.spin.set(rnd(-6, 6), rnd(-6, 6), rnd(-6, 6));
  rk.mesh.position.copy(rk.pos);
  rk.mesh.visible = true;
  rk.last.copy(rk.pos);
  rk.t = 0; rk.dur = dur; rk.fireAcc = 0; rk.smokeAcc = 0; rk.live = true;
}

// Drop puffs along the segment the rock just travelled, one every `step`
// units of path, so the trail density does not depend on the frame rate.
// `acc` carries the leftover distance between frames.
function trailAlong(rk, acc, step, pool, kind, u) {
  const seg = rk.last.distanceTo(rk.pos), r = rk.r;
  let d = step - acc;
  while (d <= seg) {
    const f = d / seg;
    const x = rk.last.x + (rk.pos.x - rk.last.x) * f;
    const y = rk.last.y + (rk.pos.y - rk.last.y) * f;
    const z = rk.last.z + (rk.pos.z - rk.last.z) * f;
    if (kind === 0)
      emitPuff(pool, x, y, z, rnd(-1, 1) * u, rnd(-0.5, 1.5) * u, rnd(-1, 1) * u,
               METEOR.fireLife, r * 1.8, r * 0.35, 0);
    else
      emitPuff(pool, x, y, z, rnd(-1.5, 1.5) * u, rnd(1, 3) * u, rnd(-1.5, 1.5) * u,
               METEOR.smokeLife, r * 1.2, r * 4.5, 2);
    d += step;
  }
  return (acc + seg) % step;
}

function impact(sim, rk) {
  const u = sim.u, r = rk.r, p = rk.pos;
  const gy = groundY(ride, p.x, p.z);
  for (let i = 0; i < 5; i++)
    emitPuff(sim.fire, p.x, gy + r, p.z, rnd(-2, 2) * u, rnd(1, 4) * u, rnd(-2, 2) * u,

  for (let i = 0; i < 9; i++) {
    const a = rnd(0, 6.28), s = rnd(4, 10) * u;
    emitPuff(sim.smoke, p.x, gy + r * 0.5, p.z, Math.cos(a) * s, rnd(1.5, 4) * u, Math.sin(a) * s,
             rnd(0.9, 1.5), r * 1.5, r * 8, 3);
  }
  rk.live = false; rk.mesh.visible = false;
}

function resetMeteors(sim) {
  for (const rk of sim.rocks) { rk.live = false; rk.mesh.visible = false; }
  sim.fire.life.fill(0); sim.smoke.life.fill(0);
  updatePuffs(sim.fire, 0); updatePuffs(sim.smoke, 0);
}

function meteorTick(dt) {
  const g = ride, fld = g?.meteors; if (!fld) return;
  const sim = fld.sim;
  // Off: one clearing pass, then only the puff pools keep ticking (the
  // zombies borrow the smoke pool for their dust).
  if (!meteorsOn) {
    if (!sim.cleared) { resetMeteors(sim); sim.cleared = true; }
  } else {
    sim.cleared = false;
    const u = sim.u;
    // The head marker exists only after the first full build; hold off
    // until there is a bike to fall ahead of.
    if (g.head && g.headPos) {
      sim.spawnIn -= dt;
      if (sim.spawnIn <= 0) {
        sim.spawnIn = rnd(0.5, 1.5) / (playing ? METEOR.rate : METEOR.idleRate);
        let rk = null;
        for (const r of sim.rocks) if (!r.live) { rk = r; break; }
        if (rk) spawnMeteor(g, sim, rk);
      }
    }
    for (const rk of sim.rocks) {
      if (!rk.live) continue;
      rk.t += dt;
      rk.last.copy(rk.pos);
      rk.vel.y -= rk.grav * dt;
      rk.pos.addScaledVector(rk.vel, dt);
      rk.mesh.position.copy(rk.pos);
      rk.mesh.rotation.x += rk.spin.x * dt;
      rk.mesh.rotation.y += rk.spin.y * dt;
      rk.mesh.rotation.z += rk.spin.z * dt;
      rk.fireAcc = trailAlong(rk, rk.fireAcc, METEOR.fireStep * u, sim.fire, 0, u);
      rk.smokeAcc = trailAlong(rk, rk.smokeAcc, METEOR.smokeStep * u, sim.smoke, 2, u);

      // ground), with a time cap so a rock can never fall forever off the slab.
      if (rk.pos.y <= groundY(g, rk.pos.x, rk.pos.z) + rk.r * 0.3 || rk.t > rk.dur * 1.6)
        impact(sim, rk);
    }
  }
  updatePuffs(sim.fire, dt);
  updatePuffs(sim.smoke, dt);
}

// ---- Zombie horde ---------------------------------------------------------
// The other half of the apocalypse: blocky low-poly zombies claw their way
// out of the ground ahead of the rider, shamble after the bike, lunge as it
// passes, miss, topple and sink back into the earth. Same discipline as the
// meteors: one fixed pool per ride, nothing allocated in the loop, every
// size in bike units. Unlit — the boxes keep their form through a per-face
// shade baked into ONE shared box geometry that every material multiplies
// (material.color x vertex colour), so a whole walker is nine meshes of the
// same geometry at different scales. Dust reuses the meteor smoke pool.
const ZOMBIE = {
  pool: 12,             // walkers on the ground at once (hard cap)
  rate: 2.2,            // spawns per second while playing
  idleRate: 0.35,       // ... while paused
  ahead: [25, 70],      // rise this far ahead of the bike (bike units)
  lateral: [9, 40],     // and this far off the route, either side
  height: 14,           // standing height (bike ~11 long, saddle at 10)
  chase: 0.62,          // ground speed as a fraction of the bike's
  minSpeed: 4,          // floor, so a paused ride still gets shamblers
  maxSpeed: 40,
  lunge: 7,             // leap once within this distance of the bike
  chaseFor: 7,          // give up after this many seconds and sink
  dropBehind: 90,       // ... or once this far behind the bike
  rise: 0.8, lungeFor: 0.45, fallFor: 0.5, sinkFor: 1.2, // phase lengths (s)
};
let zombiesOn = true;

// Unit box with the shading baked in: 24 verts, four per face, in three's
// +x -x +y -y +z -z order. Top brightest, the four sides stepped so no two
// adjacent faces share a tone, bottom darkest — the unlit boxes still read
// as solids from any angle.
function shadedBoxGeometry() {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const shade = [0.86, 0.74, 1.0, 0.55, 0.8, 0.68];
  const col = new Float32Array(24 * 3);
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++)
    col.fill(shade[f], (f * 4 + v) * 3, (f * 4 + v) * 3 + 3);
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

// One walker, facing +X like the bike. Legs and arms hang from pivot groups
// so they can swing; the body pivots at the hip for the lean, bob and sway.
function makeZombie(geo, mats, v) {
  const box = (mat, sx, sy, sz, x, y, z, parent) => {
    const m = new THREE.Mesh(geo, mat);

    parent.add(m); return m;

  const H = ZOMBIE.height * v.tall, w = v.wide;
  const legH = H * 0.36, torsoH = H * 0.36, headS = H * 0.17, armH = H * 0.34;
  const legL = new THREE.Group(), legR = new THREE.Group();
  legL.position.set(0, legH, 0.95 * w); legR.position.set(0, legH, -0.95 * w);
  box(mats.pants, 1.3 * w, legH, 1.3 * w, 0, -legH / 2, 0, legL);
  box(mats.pants, 1.3 * w, legH, 1.3 * w, 0, -legH / 2, 0, legR);
  root.add(legL, legR);
  const body = new THREE.Group(); body.position.y = legH; root.add(body);
  box(v.shirt, 2.4 * w, torsoH, 3.6 * w, 0, torsoH / 2, 0, body);
  const head = new THREE.Group();
  head.position.set(0, torsoH + headS / 2 + 0.15, 0);
  head.rotation.x = v.tilt; // a cocked head is most of the "wrong" in a zombie

  box(mats.skin, headS, headS, headS, 0, 0, 0, head);
  const eye = headS * 0.18;
  box(mats.dark, eye, eye * 0.8, eye, headS / 2, headS * 0.08, headS * 0.24, head);
  box(mats.dark, eye, eye * 0.8, eye, headS / 2, headS * 0.08, -headS * 0.24, head);
  if (v.hair) box(mats.dark, headS * 0.9, headS * 0.28, headS * 1.04, -headS * 0.08, headS * 0.5, 0, head);
  const armL = new THREE.Group(), armR = new THREE.Group();
  armL.position.set(0, torsoH * 0.92, 2.2 * w); armR.position.set(0, torsoH * 0.92, -2.2 * w);
  box(v.shirt, 1.05 * w, armH * 0.45, 1.05 * w, 0, -armH * 0.225, 0, armL); // sleeve
  box(mats.skin, 0.95 * w, armH * 0.55, 0.95 * w, 0, -armH * 0.725, 0, armL);
  box(v.shirt, 1.05 * w, armH * 0.45, 1.05 * w, 0, -armH * 0.225, 0, armR);
  box(mats.skin, 0.95 * w, armH * 0.55, 0.95 * w, 0, -armH * 0.725, 0, armR);
  body.add(armL, armR);
  root.visible = false;
  return { root, body, head, legL, legR, armL, armR, H, legH, lean: v.lean,
           live: false, state: 0, t: 0, phase: rnd(0, 6.28), mult: rnd(0.8, 1.2),
           pos: new THREE.Vector3(), yaw: 0 };
}

// Procedural shamble. phase advances with time; reach (0..1) pushes the
// arms out for the lunge. Rotations are about local Z because the walker
// faces +X: a negative body Z is a lean FORWARD.
function poseZombie(zb, reach) {
  const p = zb.phase, s = Math.sin(p);
  zb.legL.rotation.z = s * 0.55;
  zb.legR.rotation.z = -s * 0.55;
  zb.body.position.y = zb.legH + Math.abs(s) * zb.H * 0.025;
  zb.body.rotation.z = -(zb.lean + reach * 0.35 + Math.sin(p * 0.5) * 0.06);
  zb.body.rotation.x = s * 0.07;
  zb.armL.rotation.z = Math.PI / 2 - 0.3 + Math.sin(p + 0.6) * 0.12 + reach * 0.4;
  zb.armR.rotation.z = Math.PI / 2 - 0.15 + Math.sin(p - 0.4) * 0.12 + reach * 0.4;
}

function makeZombieHorde(g) {
  const grp = new THREE.Group();
  const geo = shadedBoxGeometry();
  const mk = c => new THREE.MeshBasicMaterial({ color: c, vertexColors: true });
  const mats = { skin: mk(0x93b27c), pants: mk(0x45424c), dark: mk(0x1e1e24),
                 shirts: [mk(0x5f6d7c), mk(0x7a6552), mk(0x6b5f74), mk(0x8a6a6a)] };
  const walkers = [];
  for (let i = 0; i < ZOMBIE.pool; i++) {
    const zb = makeZombie(geo, mats, {
      tall: rnd(0.85, 1.1), wide: rnd(0.85, 1.2), lean: rnd(0.15, 0.45),
      tilt: rnd(-0.25, 0.25), hair: Math.random() < 0.6,
      shirt: mats.shirts[i % mats.shirts.length] });
    grp.add(zb.root);
    walkers.push(zb);
  }
  scene.add(grp);
  grp.sim = { u: g.mScale, walkers, spawnIn: 0.3, cleared: false,
              bikeSpeed: 0, lastHead: new THREE.Vector3() };
  return grp;
}

// Shortest-way turn with the delta normalised BEFORE the >180 wrap — the
// unnormalised version is the classic "does nothing forever" heading bug.
function turnToward(cur, target, maxStep) {
  let d = (target - cur) % (2 * Math.PI);
  if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
  return cur + Math.max(-maxStep, Math.min(maxStep, d));
}

// Ground dust from the meteor smoke pool (kind 3). Silently nothing when the
// shower has been torn down or never built.
function dustPuff(g, x, y, z, r, n) {
  const pool = g.meteors?.sim?.smoke; if (!pool) return;
  const u = g.mScale || 1;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), s = rnd(2, 6) * u;
    emitPuff(pool, x, y, z, Math.cos(a) * s, rnd(1, 3) * u, Math.sin(a) * s,
             rnd(0.7, 1.2), r * 0.8, r * 3, 3);
  }
}

const ZS = { RISE: 0, CHASE: 1, LUNGE: 2, FALL: 3, SINK: 4 };
function spawnZombie(g, sim, zb) {
  const u = sim.u, hp = g.headPos, ry = g.head.rotation.y;
  const fx = Math.cos(ry), fz = -Math.sin(ry);
  const ahead = rnd(ZOMBIE.ahead[0], ZOMBIE.ahead[1]) * u;
  const side = (Math.random() < 0.5 ? -1 : 1) * rnd(ZOMBIE.lateral[0], ZOMBIE.lateral[1]) * u;
  const x = hp.x + fx * ahead - fz * side, z = hp.z + fz * ahead + fx * side;
  const gy = groundY(g, x, z);
  zb.pos.set(x, gy, z);
  zb.yaw = Math.atan2(-(hp.z - z), hp.x - x); // face the bike as it comes
  zb.root.position.set(x, gy - zb.H * u, z);
  zb.root.rotation.set(0, zb.yaw, 0);
  zb.root.scale.setScalar(u);
  zb.root.visible = true;
  zb.live = true; zb.state = ZS.RISE; zb.t = 0;
  dustPuff(g, x, gy, z, zb.H * u * 0.25, 6);
}

function resetZombies(sim) {
  for (const zb of sim.walkers) { zb.live = false; zb.root.visible = false; }
}

function zombieTick(dt) {
  const g = ride, fld = g?.zombies; if (!fld) return;
  const sim = fld.sim;
  if (!zombiesOn) {
    if (!sim.cleared) { resetZombies(sim); sim.cleared = true; }
    return;
  }
  sim.cleared = false;
  const u = sim.u, hp = g.headPos, ready = !!(g.head && hp);
  let fx = 1, fz = 0;
  if (ready) {
    // Bike ground speed, smoothed and capped: a scrub jump would otherwise
    // read as warp speed and the horde would sprint for a second.
    const step = Math.min(60 * u, hp.distanceTo(sim.lastHead) / Math.max(dt, 1e-3));
    sim.bikeSpeed += (step - sim.bikeSpeed) * 0.15;
    sim.lastHead.copy(hp);
    fx = Math.cos(g.head.rotation.y); fz = -Math.sin(g.head.rotation.y);
    sim.spawnIn -= dt;
    if (sim.spawnIn <= 0) {
      sim.spawnIn = rnd(0.5, 1.5) / (playing ? ZOMBIE.rate : ZOMBIE.idleRate);
      let zb = null;
      for (const w of sim.walkers) if (!w.live) { zb = w; break; }
      if (zb) spawnZombie(g, sim, zb);
    }
  }
  // Chase speed follows the bike so the horde never catches it but is never
  // static either: paused rides get a slow shamble from the floor.
  const speed = Math.min(ZOMBIE.maxSpeed * u,
                         Math.max(ZOMBIE.minSpeed * u, ZOMBIE.chase * sim.bikeSpeed));
  for (const zb of sim.walkers) {
    if (!zb.live) continue;
    zb.t += dt;
    const H = zb.H * u, r = zb.root, p = zb.pos;
    let reach = 0;
    if (zb.state === ZS.RISE) {
      const k = Math.min(1, zb.t / ZOMBIE.rise);
      r.position.y = p.y - H * (1 - k) * (1 - k); // eases out as it surfaces
      zb.phase += dt * 3; reach = 0.6;
      if (k >= 1) { zb.state = ZS.CHASE; zb.t = 0; }
    } else if (zb.state === ZS.CHASE) {
      zb.phase += dt * 7;
      if (ready) {
        const dx = hp.x - p.x, dz = hp.z - p.z, dist = Math.hypot(dx, dz);
        zb.yaw = turnToward(zb.yaw, Math.atan2(-dz, dx), 2.5 * dt);
        const v = speed * zb.mult * dt;
        p.x += Math.cos(zb.yaw) * v; p.z -= Math.sin(zb.yaw) * v;
        p.y = groundY(g, p.x, p.z);
        reach = Math.max(0, 1 - dist / (ZOMBIE.lunge * 3 * u)) * 0.5;
        const behind = (p.x - hp.x) * fx + (p.z - hp.z) * fz;
        if (dist < ZOMBIE.lunge * u) { zb.state = ZS.LUNGE; zb.t = 0; }
        else if (zb.t > ZOMBIE.chaseFor || behind < -ZOMBIE.dropBehind * u) {
          zb.state = ZS.SINK; zb.t = 0;
          dustPuff(g, p.x, p.y, p.z, H * 0.2, 3);
        }
      }
      r.position.set(p.x, p.y, p.z);
      r.rotation.y = zb.yaw;
    } else if (zb.state === ZS.LUNGE) {
      // A leap along the current heading with a small hop; the bike has
      // moved on by the time it lands, which is the whole joke.
      const k = Math.min(1, zb.t / ZOMBIE.lungeFor);
      const v = speed * 2.2 * dt;
      p.x += Math.cos(zb.yaw) * v; p.z -= Math.sin(zb.yaw) * v;
      p.y = groundY(g, p.x, p.z);
      r.position.set(p.x, p.y + Math.sin(k * Math.PI) * H * 0.2, p.z);
      reach = 1; zb.phase += dt * 2;
      if (k >= 1) { zb.state = ZS.FALL; zb.t = 0; }
    } else if (zb.state === ZS.FALL) {
      // Topple face first: a negative root Z tips the top toward +X.
      const k = Math.min(1, zb.t / ZOMBIE.fallFor);
      r.rotation.z = -k * k * Math.PI / 2;
      r.position.y = p.y;
      reach = 1;
      if (k >= 1) { zb.state = ZS.SINK; zb.t = 0; dustPuff(g, p.x, p.y, p.z, H * 0.25, 5); }
    } else { // SINK
      const k = Math.min(1, zb.t / ZOMBIE.sinkFor);
      r.position.y = p.y - H * k;
      if (k >= 1) { zb.live = false; r.visible = false; r.rotation.z = 0; }
    }
    poseZombie(zb, reach);
  }
}

// ---- Maung convoy ---------------------------------------------------------
// Third act: a convoy of blocky Pindad Maung 4x4s on the rider's tail. Unlike
// the zombies they do not free-roam — they drive the ACTUAL route, a fixed
// path distance behind the bike (with a slow breathing in and out of that
// gap), so they take every corner the rider took and can never overtake.
// Same rules as before: fixed pool per ride, no allocation in the loop, all
// sizes in bike units, unlit (shaded boxes + flat lamp tones, the strobes are
// a material swap, not a light). Wheel dust goes into the meteor smoke pool.
const MAUNG = {
  count: 3,                 // vehicles in the convoy
  gap: [24, 54, 84],        // path distance behind the bike, per vehicle (bike units)
  breathe: 3,               // +/- slow drift of that gap, so the tail feels alive
  lateral: [3, -3, 2.5],    // formation offset off the route line, per vehicle
  wheelR: 3.2,              // wheel radius; body ~22 long x 9 wide x 12 tall
  dustStep: 5,              // one dust puff per N units of travel, per vehicle
  strobe: 0.22,             // seconds per red/blue flip
};
let maungOn = true;

function makeMaung(box, wheelGeo, mats) {
  const root = new THREE.Group();
  const mesh = (geo, mat, sx, sy, sz, x, y, z, parent = root) => {
    const m = new THREE.Mesh(geo, mat);
    m.scale.set(sx, sy, sz); m.position.set(x, y, z);
    parent.add(m); return m;
  };
  const body = new THREE.Group(); root.add(body);
  const B = (mat, sx, sy, sz, x, y, z) => mesh(box, mat, sx, sy, sz, x, y, z, body);
  B(mats.olive, 22, 4, 9, 0, 5, 0);            // tub
  B(mats.oliveHi, 13, 4.6, 8.6, -2.5, 9.2, 0); // cabin
  B(mats.glass, 12.6, 2, 8.8, -2.5, 9.7, 0);   // window band, proud of the cabin
  B(mats.olive, 7.5, 1.4, 8.6, 7.5, 7.5, 0);   // hood
  B(mats.dark, 0.6, 2.6, 6.4, 11.1, 5.8, 0);   // grille
  B(mats.lamp, 0.5, 1.2, 1.3, 11.15, 6.9, 3);  // headlights: flat lamp tone
  B(mats.lamp, 0.5, 1.2, 1.3, 11.15, 6.9, -3);
  B(mats.dark, 1.4, 1, 9.8, 11, 3.4, 0);       // bumper
  B(mats.dark, 12, 0.5, 8, -2.5, 11.8, 0);     // roof rack
  B(mats.dark, 1.2, 0.5, 8.6, -8.4, 7.3, 0);   // tailgate lip
  const strobeL = B(mats.redOn, 1.6, 0.9, 1.6, 0.5, 12.5, 2.2);
  const strobeR = B(mats.blueOff, 1.6, 0.9, 1.6, 0.5, 12.5, -2.2);
  // Wheels: cylinder axis along Z (rotated in the geometry), spun about Z.
  const wheels = [];
  for (const [x, z] of [[7, 5], [7, -5], [-6.5, 5], [-6.5, -5]]) {
    const w = mesh(wheelGeo, mats.rubber, MAUNG.wheelR, MAUNG.wheelR, 2.4, x, MAUNG.wheelR, z);
    mesh(wheelGeo, mats.hub, MAUNG.wheelR * 0.45, MAUNG.wheelR * 0.45, 2.6, x, MAUNG.wheelR, z);
    wheels.push(w);
  }
  const spare = mesh(wheelGeo, mats.rubber, MAUNG.wheelR, MAUNG.wheelR, 2, -11.6, 7.5, 0, body);
  spare.rotation.y = Math.PI / 2; // axis along X, flat against the tailgate
  return { root, body, wheels, strobeL, strobeR, s: 0, lastS: 0, dustAcc: 0,
           pos: new THREE.Vector3(), yaw: 0 };
}

function makeMaungConvoy(g) {
  const grp = new THREE.Group();
  const box = shadedBoxGeometry();
  const wheelGeo = new THREE.CylinderGeometry(1, 1, 1, 10);
  wheelGeo.rotateX(Math.PI / 2);
  const mk = (c, vc = true) => new THREE.MeshBasicMaterial({ color: c, vertexColors: vc });
  const mats = { olive: mk(0x6b7a4a), oliveHi: mk(0x7b8a58), glass: mk(0x2a3038),
                 dark: mk(0x2b2b31), lamp: mk(0xf2d36b), rubber: mk(0x232326, false),
                 hub: mk(0x8a8f96, false),
                 redOn: mk(0xe0242c), redOff: mk(0x5a1a1e), blueOn: mk(0x2457e0),
                 blueOff: mk(0x1a2652) };
  const cars = [];
  for (let i = 0; i < MAUNG.count; i++) {
    const car = makeMaung(box, wheelGeo, mats);
    car.root.scale.setScalar(g.mScale);
    car.root.visible = false; // until it has a spot on the route
    car.phase = i * 2.1;
    grp.add(car.root);
    cars.push(car);
  }
  grp.visible = maungOn;
  scene.add(grp);
  grp.sim = { u: g.mScale, cars, mats, t: 0, blinkIn: MAUNG.strobe, flip: false };
  return grp;
}

// Position + heading on the drawn route at path distance s (metres of
// cumD). Binary search, then interpolate the drawn (view-mode lifted)
// points so the convoy rides whatever surface the bike rides.
function trackAt(g, s, out) {
  const D = g.cumD, P = g.drawn;
  const n = Math.min(D.length, P.length);
  s = Math.min(D[n - 1], Math.max(0, s));
  let lo = 1, hi = n - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (D[mid] < s) lo = mid + 1; else hi = mid; }
  const a = P[lo - 1], b = P[lo];
  const span = D[lo] - D[lo - 1];
  const f = span > 1e-9 ? (s - D[lo - 1]) / span : 0;
  out.pos.copy(a).lerp(b, f);
  const dx = b.x - a.x, dz = b.z - a.z;
  if (Math.abs(dx) + Math.abs(dz) > 1e-6) out.yaw = Math.atan2(-dz, dx);
  return out;
}

function maungTick(dt) {
  const g = ride, fld = g?.maung; if (!fld || !maungOn) return;
  const sim = fld.sim, u = sim.u;
  if (!g.drawn || !g.cumD || g.headDist == null) return;
  sim.t += dt;
  // Strobes: swap materials, never a light.
  sim.blinkIn -= dt;
  if (sim.blinkIn <= 0) {
    sim.blinkIn = MAUNG.strobe; sim.flip = !sim.flip;
    const m = sim.mats;
    for (const car of sim.cars) {
      car.strobeL.material = sim.flip ? m.redOn : m.redOff;
      car.strobeR.material = sim.flip ? m.blueOff : m.blueOn;
    }
  }
  for (let i = 0; i < sim.cars.length; i++) {
    const car = sim.cars[i];
    // Target spot: a breathing gap behind the bike. Before the bike is that
    // far into the ride the convoy waits at the start line.
    const gap = (MAUNG.gap[i] + Math.sin(sim.t * 0.45 + car.phase) * MAUNG.breathe) * u;
    const s = Math.max(0, g.headDist - gap);
    car.lastS = car.s; car.s = s;
    trackAt(g, s, car);
    // Formation: slide off the route line along the local right vector.
    const fx = Math.cos(car.yaw), fz = -Math.sin(car.yaw);
    const off = MAUNG.lateral[i] * u;
    car.pos.x += -fz * off; car.pos.z += fx * off;
    car.root.position.copy(car.pos);
    car.root.rotation.y = car.yaw;
    car.root.visible = true;
    // Wheels roll with the distance actually covered; the body bobs a
    // touch with speed so a moving convoy never looks like a slide.
    const ds = car.s - car.lastS;
    const spin = ds / (MAUNG.wheelR * u);
    for (const w of car.wheels) w.rotation.z -= spin;
    const v = Math.abs(ds) / Math.max(dt, 1e-3);
    car.body.position.y = Math.sin(sim.t * 11 + car.phase) * Math.min(0.25, v / (60 * u));
    // Dust from the rear axle, one puff per dustStep units of travel.
    car.dustAcc += Math.abs(ds);
    const step = MAUNG.dustStep * u;
    if (car.dustAcc >= step && v > 2 * u) {
      car.dustAcc %= step;
      dustPuff(g, car.pos.x - fx * 7 * u, car.pos.y, car.pos.z - fz * 7 * u, 2.5 * u, 1);
    }
  }
}

function buildRide(gj) {
  clearRide();
  const feat = (gj.features || []).find(f => f.geometry?.type === 'LineString');
  if (!feat) throw new Error('no LineString feature in this GeoJSON');
  const coords = feat.geometry.coordinates;
  if (coords.length < 2) throw new Error('track has fewer than 2 points');
  const speed = feat.properties?.speed_kmh || coords.map(() => 0);
  const tArr = feat.properties?.t_s || coords.map((_, i) => i);

  const proj = project(coords);
  const P = proj.pts;
  const vMax = Math.max(1e-3, ...speed), vMin = Math.min(...speed);
  const vNorm = speed.map(s => (s - vMin) / Math.max(1e-3, vMax - vMin));
  const cumD = [0];
  for (let i = 1; i < P.length; i++) cumD.push(cumD[i - 1] + P[i].distanceTo(P[i - 1]));

  const g = { P, proj, coords, speed, tArr, vNorm, vMin, vMax, cumD,
              tMin: tArr[0], tMax: tArr[tArr.length - 1],
              summary: gj.properties || {} };
  ride = g;

  rebuildGeometry(); // positions depend on the relief slider

  // Markers scale with the ride's footprint so a city loop and an alpine
  // century both read correctly.
  const span = new THREE.Box3().setFromPoints(P).getSize(new THREE.Vector3());
  g.mScale = Math.min(30, Math.max(0.35, Math.max(span.x, span.z) / 260));
  g.startDot = makeFlag(COL.start);
  g.endDot = makeFlag(null, true); // checkered finish
  g.head = makeBike();
  for (const m of [g.startDot, g.endDot, g.head]) m.scale.setScalar(g.mScale);
  g.meteors = makeMeteorField(g); // sized from mScale, so it comes after it
  g.zombies = makeZombieHorde(g);
  g.maung = makeMaungConvoy(g);
  g.startDot.position.copy(g.drawn[0]);
  g.endDot.position.copy(g.drawn[g.drawn.length - 1]);

  frameCamera();
  headT = 1; setProgress(1);
  showChrome(g.summary, vMin, vMax);
  buildSlab(g); // async: the map diorama pops in when its tiles arrive
}

const ROUTE_LIFT = 2; // metres above the slab top, so the line never z-fights

function rebuildGeometry() {
  const g = ride; if (!g) return;
  // How the route is lifted:
  //  overGrid (Elevation/Progress): altitude ribbon over the bare grid,
  //    curtain to a flat y=0 baseline.
  //  overMap (Map+Elev): the same altitude ribbon but riding HIGH above the
  //    real terrain surface, curtain dropping back down to the terrain.
  //  else (Map/Grid): draped on the terrain relief.
  const overGrid = viewMode === 'template';
  const overMap = viewMode === 'hybrid';
  const HYBRID_RIBBON = 2.4; // extra altitude gain for the floating ribbon
  const surfaceOf = p => (g.demSample ? g.demSample(p.x, p.z) * exagT() : 0);
  const pts = g.P.map(p => {
    let y;
    if (overMap) y = surfaceOf(p) + p.y * exag * HYBRID_RIBBON + 16;
    else if (overGrid) y = p.y * exag + 8;
    else y = surfaceOf(p);
    return new THREE.Vector3(p.x, y + ROUTE_LIFT, p.z);
  });
  g.drawn = pts;
  g.trackMode = overGrid || overMap; // curtain shown + reframing
  g.curtainToBaseline = overGrid;    // grid ribbon drops to 0; hybrid to terrain

  // Route line, per-vertex speed colour.
  const pos = new Float32Array(pts.length * 3);
  const col = new Float32Array(pts.length * 3);
  const tmp = new THREE.Color();
  for (let i = 0; i < pts.length; i++) {
    pos[i * 3] = pts[i].x; pos[i * 3 + 1] = pts[i].y; pos[i * 3 + 2] = pts[i].z;
    speedColor(g.vNorm[i], tmp);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  const geo = new LineGeometry();
  geo.setPositions(pos); geo.setColors(col);
  disposeObj(g.route);
  const mat = new LineMaterial({ vertexColors: true, linewidth: 5,
    worldUnits: false, transparent: true });
  mat.resolution.set(innerWidth, innerHeight);
  const line = new Line2(geo, mat);
  line.computeLineDistances();
  scene.add(line); g.route = line; g.mat = mat; g.segCount = pts.length - 1;

  // Elevation curtain: a translucent wall from the route down to the ground,
  // tinted by the same ramp — gives the flyover its sense of relief.
  const n = pts.length;
  const cPos = new Float32Array(n * 2 * 3);
  const cCol = new Float32Array(n * 2 * 3);
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    // Grid ribbon drops to a flat baseline; hybrid + draped views drop the
    // curtain to the terrain surface just under the line.
    const by = g.curtainToBaseline ? 0
             : g.demSample ? g.demSample(p.x, p.z) * exagT() : 0;
    cPos.set([p.x, p.y, p.z, p.x, by, p.z], i * 6);
    speedColor(g.vNorm[i], tmp);
    cCol.set([tmp.r, tmp.g, tmp.b, tmp.r, tmp.g, tmp.b], i * 6);
  }
  const idx = [];
  for (let i = 0; i < n - 1; i++) {
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    idx.push(a, b, c, b, d, c);
  }
  const cg = new THREE.BufferGeometry();
  cg.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
  cg.setAttribute('color', new THREE.BufferAttribute(cCol, 3));
  cg.setIndex(idx);
  disposeObj(g.curtain);
  const curtain = new THREE.Mesh(cg, new THREE.MeshBasicMaterial({
    vertexColors: true, transparent: true, opacity: g.trackMode ? 0.26 : 0.14,
    side: THREE.DoubleSide, depthWrite: false }));

  if (g.startDot) g.startDot.position.copy(pts[0]);
  if (g.endDot) g.endDot.position.copy(pts[pts.length - 1]);
  setProgress(headT);
}

// ---- Map diorama: a slab "cut out of the earth" under the route.
// Basemap raster tiles (CARTO Positron, CORS-enabled) are stitched onto a
// canvas, cropped to the padded ride bbox, and laid on top of a box whose
// sides wear a soil/rock gradient. Fails silently (grid stays) when offline.
const mercX = lon => (lon + 180) / 360;
const mercY = lat => {
  const s = Math.sin(lat * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);

const loadImg = url => new Promise((res, rej) => {
  const im = new Image();
  im.crossOrigin = 'anonymous';
  im.onload = () => res(im); im.onerror = () => rej(new Error('tile failed'));
  im.src = url;

// -- Basemap: MapLibre GL JS renders the bbox (OpenFreeMap "liberty" vector
// style, free/no key) into a hidden map; we copy its canvas out as the slab
// texture. Vector = crisp at any zoom and exact mercator, which fixes both
// the blurry-on-zoom look and the base/detail registration ghosting.
//
// The earlier context-loss ("WebGL context was lost" -> blank viewer) came
// from keeping a LIVE interactive MapLibre map around (a second, persistent
// GL context fighting Three's). Here there is exactly ONE hidden map, created
// once and REUSED for every render (never per-call churn), and renders are
// serialised through a queue. Two stable contexts coexist fine; if MapLibre
// still fails (offline/blocked) we fall back to the OSM raster stitch below.

    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css';
    document.head.appendChild(css);
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('maplibre load failed'));
    document.head.appendChild(s);

// A pared-back basemap: start from OpenFreeMap "positron" (already the
// minimal OpenMapTiles style), drop every symbol layer — at specimen scale
// labels and POI icons are just noise — and retint what's left to a quiet
// paper palette so the route is the only thing with colour.
// Tuned for readability on the slab: the land is a warm paper tone so WHITE
// roads stand out against it, water and parks carry real (if muted) colour,
// and buildings sit a clear step darker than the land. An earlier pass had
// every tone within a few percent of white and the map read as blank.
const MINI = {
  paper:  '#ebe7e0',  // background / land — deliberately darker than the roads
  water:  '#a8c4d4',
  green:  '#cfdcc2',  // parks, woods
  build:  '#dcd6cc',
  road:   '#ffffff',  // road fill
  casing: '#bcb5a9',  // road outline, minor roads
  rail:   '#c9c2b6',
  admin:  '#b6ae9f',
};
async function minimalStyle() {
  const style = await (await fetch('https://tiles.openfreemap.org/styles/positron')).json();
  style.layers = style.layers.filter(l => l.type !== 'symbol').map(l => {
    const sl = l['source-layer'] || '', id = l.id, p = { ...(l.paint || {}) };
    const isCasing = /casing|outline/.test(id);
    if (l.type === 'background') p['background-color'] = MINI.paper;
    else if (l.type === 'fill') {
      delete p['fill-outline-color']; // undefined would fail style validation
      if (sl === 'water') p['fill-color'] = MINI.water;
      else if (sl === 'building') p['fill-color'] = MINI.build;
      else if (sl === 'park' || sl === 'landcover') p['fill-color'] = MINI.green;
      else if (sl === 'landuse') p['fill-color'] = MINI.paper;
      else p['fill-color'] = MINI.paper;
      p['fill-opacity'] = 1;
    } else if (l.type === 'line') {
      if (sl === 'waterway') p['line-color'] = MINI.water;
      else if (sl === 'boundary') { p['line-color'] = MINI.admin; p['line-opacity'] = 0.6; }
      else if (/railway/.test(id)) { p['line-color'] = MINI.rail; p['line-opacity'] = 0.8; }
      else if (sl === 'transportation' || sl === 'aeroway')
        p['line-color'] = isCasing || /minor|path|subtle/.test(id) ? MINI.casing : MINI.road;
      else p['line-color'] = MINI.casing;
      // Flat, unmodulated strokes read cleaner than the stock opacity ramps.
      if (p['line-opacity'] === undefined) p['line-opacity'] = 1;
    }

}

let _mlMap = null, _mlDiv = null, _mlQueue = Promise.resolve();
async function mlReady() {
  await loadMapLibre();
  if (_mlMap) return _mlMap;
  _mlDiv = document.createElement('div');
  _mlDiv.style.cssText = 'position:fixed;left:-20000px;top:0;width:1024px;height:1024px;';
  document.body.appendChild(_mlDiv);
  _mlMap = new maplibregl.Map({
    container: _mlDiv,
    style: await minimalStyle(),
    interactive: false, attributionControl: false,
    preserveDrawingBuffer: true, fadeDuration: 0, antialias: true,
  });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('maplibre init timeout')), 20000);
    _mlMap.once('load', () => { clearTimeout(to); res(); });
  });

// Render a bbox flat (pitch 0) into a canvas ~maxPx on its long side, matched
// to the bbox's mercator aspect so it drapes edge-to-edge. Sets _mpp (metres
// per pixel) for LOD gating. Serialised — one render at a time on the shared map.
function mlRender(lonW, latS, lonE, latN, maxPx = 2048) {
  const run = async () => {
    const map = await mlReady();
    const mAspect = (mercX(lonE) - mercX(lonW)) / (mercY(latS) - mercY(latN));
    const cssW = mAspect >= 1 ? maxPx : Math.max(256, Math.round(maxPx * mAspect));
    const cssH = mAspect >= 1 ? Math.max(256, Math.round(maxPx / mAspect)) : maxPx;
    _mlDiv.style.width = cssW + 'px'; _mlDiv.style.height = cssH + 'px';
    map.resize();
    map.fitBounds([[lonW, latS], [lonE, latN]], { padding: 0, animate: false, duration: 0 });
    await new Promise((res, rej) => {
      const to = setTimeout(() => rej(new Error('maplibre render timeout')), 15000);
      map.once('idle', () => { clearTimeout(to); res(); });
    });
    const src = map.getCanvas();
    const out = document.createElement('canvas');
    out.width = src.width; out.height = src.height;
    const ctx = out.getContext('2d');
    ctx.filter = 'saturate(1.02) contrast(1.01)';
    ctx.drawImage(src, 0, 0);
    const kx = Math.cos(((latS + latN) / 2) * Math.PI / 180) * 111320;
    out._mpp = (lonE - lonW) * kx / out.width; // metres per output pixel
    return out;
  };
  const p = _mlQueue.then(run, run); // serialise regardless of prior outcome
  _mlQueue = p.catch(() => {});
  return p;
}

// -- Fallback basemap: stitch OSM standard raster tiles (free, no key) onto a
// 2D canvas (no GL context) and crop to the exact bbox. Used only when the
// MapLibre path above fails.
async function rasterStitch(lonW, latS, lonE, latN, maxPx = 4096, maxTiles = 80) {
  const TS = 256;
  // Highest zoom that still fits the texture / tile budget. (Capping the LONG
  // side matters for narrow out-and-back routes: a 616 x 3647 m strip would
  // otherwise drop to z16 and blur the streets.) A smaller bbox with the same
  // budget naturally lands on a higher zoom — that's how the detail LOD gets
  // its extra sharpness.
  let z = 3;
  for (let cand = 19; cand >= 3; cand--) {
    const w = (mercX(lonE) - mercX(lonW)) * (1 << cand) * TS;
    const h = (mercY(latS) - mercY(latN)) * (1 << cand) * TS;
    const tiles = (Math.floor(mercX(lonE) * (1 << cand)) - Math.floor(mercX(lonW) * (1 << cand)) + 1) *
                  (Math.floor(mercY(latS) * (1 << cand)) - Math.floor(mercY(latN) * (1 << cand)) + 1);
    if (Math.max(w, h) <= maxPx && tiles <= maxTiles) { z = cand; break; }
  }
  const n = 1 << z;
  const tx0 = Math.floor(mercX(lonW) * n), tx1 = Math.floor(mercX(lonE) * n);
  const ty0 = Math.floor(mercY(latN) * n), ty1 = Math.floor(mercY(latS) * n);
  const jobs = [];
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++)
      jobs.push(loadImg(`https://tile.openstreetmap.org/${z}/${tx}/${ty}.png`)
        .then(im => ({ im, tx, ty })));
  const tiles = await Promise.all(jobs);
  const stitched = document.createElement('canvas');
  stitched.width = (tx1 - tx0 + 1) * TS; stitched.height = (ty1 - ty0 + 1) * TS;
  const sc = stitched.getContext('2d');
  for (const t of tiles) sc.drawImage(t.im, (t.tx - tx0) * TS, (t.ty - ty0) * TS, TS, TS);
  const px = v => v * n * TS;
  const sx = px(mercX(lonW)) - tx0 * TS, sy = px(mercY(latN)) - ty0 * TS;
  const sw = px(mercX(lonE)) - px(mercX(lonW)), sh = px(mercY(latS)) - px(mercY(latN));
  const crop = document.createElement('canvas');
  crop.width = Math.max(2, Math.round(sw)); crop.height = Math.max(2, Math.round(sh));
  const ctx = crop.getContext('2d');
  // A touch of pop so the draped texture stays legible at a viewing angle.
  ctx.filter = 'saturate(1.1) contrast(1.06)';
  ctx.drawImage(stitched, sx, sy, sw, sh, 0, 0, crop.width, crop.height);
  crop._zoom = z;
  return crop;
}

const OSM_LINK = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
const OFM_LINK = OSM_LINK + ' &middot; <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a>';
async function mapCanvasForBbox(lonW, latS, lonE, latN, px = 3072) {
  try {
    const canvas = await mlRender(lonW, latS, lonE, latN, px);
    return { canvas, attrib: OFM_LINK };
  } catch {
    const canvas = await rasterStitch(lonW, latS, lonE, latN);
    canvas._mpp = null;
    return { canvas, attrib: OSM_LINK };
  }
}

let _earthTex = null;
function earthTex() { return _earthTex || (_earthTex = earthSideTexture()); }
function earthSideTexture() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 128;
  const x = c.getContext('2d');
  const grad = x.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0.00, '#d9c7a8'); // thin topsoil line under the map
  grad.addColorStop(0.06, '#b08a5f');
  grad.addColorStop(0.45, '#8a6647');
  grad.addColorStop(1.00, '#5d4531'); // bedrock
  x.fillStyle = grad; x.fillRect(0, 0, 4, 128);

// Terrarium raster-dem stitched + cropped to the bbox, decoded to metres and
// rebased to its lowest point (the slab's ground level).
async function fetchDem(lonW, latS, lonE, latN) {
  const TS = 256;
  let z = 3;
  for (let cand = 15; cand >= 3; cand--) {
    const w = (mercX(lonE) - mercX(lonW)) * (1 << cand) * TS;
    const h = (mercY(latS) - mercY(latN)) * (1 << cand) * TS;
    const tiles = (Math.floor(mercX(lonE) * (1 << cand)) - Math.floor(mercX(lonW) * (1 << cand)) + 1) *
                  (Math.floor(mercY(latS) * (1 << cand)) - Math.floor(mercY(latN) * (1 << cand)) + 1);
    if (Math.max(w, h) <= 320 && tiles <= 12) { z = cand; break; }
  }
  const n = 1 << z;
  const tx0 = Math.floor(mercX(lonW) * n), tx1 = Math.floor(mercX(lonE) * n);
  const ty0 = Math.floor(mercY(latN) * n), ty1 = Math.floor(mercY(latS) * n);
  const jobs = [];
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++)
      jobs.push(loadImg(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${tx}/${ty}.png`)
        .then(im => ({ im, tx, ty })));
  const tiles = await Promise.all(jobs);
  const stitched = document.createElement('canvas');
  stitched.width = (tx1 - tx0 + 1) * TS; stitched.height = (ty1 - ty0 + 1) * TS;
  const sc = stitched.getContext('2d');
  for (const t of tiles) sc.drawImage(t.im, (t.tx - tx0) * TS, (t.ty - ty0) * TS, TS, TS);
  const px = v => v * n * TS;
  const sx = px(mercX(lonW)) - tx0 * TS, sy = px(mercY(latN)) - ty0 * TS;
  const sw = px(mercX(lonE)) - px(mercX(lonW)), sh = px(mercY(latS)) - px(mercY(latN));
  const nx = Math.max(2, Math.round(sw)), ny = Math.max(2, Math.round(sh));
  const crop = document.createElement('canvas');
  crop.width = nx; crop.height = ny;
  const cc = crop.getContext('2d');
  cc.drawImage(stitched, sx, sy, sw, sh, 0, 0, nx, ny);
  const img = cc.getImageData(0, 0, nx, ny).data;
  const data = new Float32Array(nx * ny);
  let mn = Infinity;
  for (let i = 0; i < nx * ny; i++) {
    const e = img[i * 4] * 256 + img[i * 4 + 1] + img[i * 4 + 2] / 256 - 32768;
    data[i] = e;
    if (e < mn) mn = e;
  }
  for (let i = 0; i < data.length; i++) data[i] -= mn;

}

// Vertical scale for the TERRAIN surface (the relief slider, gentled).
// Map+Elev pins the terrain at full relief and hands the slider to the ribbon
// instead, so that mode's slider only changes the route's elevation.
const MAX_RELIEF = 40; // matches the slider's max
const exagT = () => (viewMode === 'hybrid' ? MAX_RELIEF : exag) / 6;

// Drape a map crop by TRUE web-mercator position instead of the plane's linear
// UVs. The crops are mercator images; the slab is an equirectangular mesh, so
// linear UVs drift from the real geography toward the edges — and because the
// base and a detail patch cover different bboxes, their drifts differ and the
// overlap ghosts. Per-vertex mercator UVs pin every layer to the same
// geography, so they register exactly. `bbox` is the crop's geographic extent.
function setMercUV(geo, centerX, centerZ, bbox) {
  const { lat0, lon0, kx, kz } = ride.proj;
  const mxW = mercX(bbox.lonW), mxE = mercX(bbox.lonE);
  const myN = mercY(bbox.latN), myS = mercY(bbox.latS);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const lon = lon0 + (centerX + pos.getX(i)) / kx;
    const lat = lat0 - (centerZ + pos.getZ(i)) / kz;
    uv.setXY(i, (mercX(lon) - mxW) / (mxE - mxW),
                1 - (mercY(lat) - myN) / (myS - myN));
  }
  uv.needsUpdate = true;
}

// (Re)build the whole specimen block at the current relief: a map-draped top
// (a heightfield when a DEM is available, flat otherwise), ONE continuous
// earth wall running from the terrain rim down to the base, and a bottom cap.
// The wall is a single piece on purpose — an earlier version stacked a
// gradient-textured box under a separately-coloured skirt, and the join
// showed up as a horizontal seam across the side of the block.
function refreshTerrain(g) {
  if (!g.slab || !g.slabX) return;
  const kill = m => {
    if (!m) return;
    g.slab.remove(m); m.geometry?.dispose?.(); m.material?.dispose?.();
  };
  kill(g.terrain); kill(g.wire); kill(g.skirt); kill(g.cap); kill(g.shadow);
  kill(g.base);
  g.terrain = g.wire = g.skirt = g.cap = g.shadow = g.base = null;
  killDetail(g); // its heightfield tracks this terrain; scheduleDetail rebuilds

  const { xW, xE, zN, zS, w, d, thick } = g.slabX;
  const cx = (xW + xE) / 2, cz = (zN + zS) / 2;
  const relief = !!g.demSample; // full terrain relief in map/grid/hybrid
  const sample = relief ? g.demSample : (() => 0);
  const ex = exagT();
  const N = relief ? 96 : 2; // flat slab needs just the four corners

  // ---- top: map-draped surface ----
  const geo = new THREE.PlaneGeometry(w, d, N - 1, N - 1);
  geo.rotateX(-Math.PI / 2); // plane "up" edge -> -Z = north
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++)
    pos.setY(i, sample(cx + pos.getX(i), cz + pos.getZ(i)) * ex);
  geo.computeVertexNormals();

  if (relief) {
    // Hillshade baked into vertex colours instead of a light: the material
    // stays unlit, so the map texture keeps its exact colours (roads
    // readable) and nothing depends on three's lighting units. Flat ground
    // lands on exactly 1.0; only real slopes darken or brighten.
    const L = new THREE.Vector3(0.45, 0.82, 0.35).normalize();
    const e = Math.max(1, Math.max(w, d) / N);
    const shade = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const x = cx + pos.getX(i), zc = cz + pos.getZ(i);
      const h = sample(x, zc) * ex;
      const hx = sample(x + e, zc) * ex, hz = sample(x, zc + e) * ex;
      const nrm = new THREE.Vector3(-(hx - h) / e, 1, -(hz - h) / e).normalize();
      const f = Math.min(1.12, Math.max(0.72, nrm.dot(L) / L.y));
      shade[i * 3] = shade[i * 3 + 1] = shade[i * 3 + 2] = f;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(shade, 3));
  }
  if (g.bbox) setMercUV(geo, cx, cz, g.bbox); // exact mercator drape
  g.terrain = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    map: g.mapTex, vertexColors: relief }));
  g.terrain.position.set(cx, 0.15, cz);
  g.slab.add(g.terrain);

  // Wireframe relief for the "grid" view mode (a technical elevation mesh with
  // no map texture). Shares the heightfield via a cloned geometry.
  g.wire = new THREE.Mesh(geo.clone(), new THREE.MeshBasicMaterial({
    color: 0x7f97b8, wireframe: true, transparent: true, opacity: 0.55 }));
  g.wire.position.copy(g.terrain.position);
  g.slab.add(g.wire);

  // ---- side wall: rim -> base, in one piece ----
  const idx = (ix, iz) => iz * N + ix;
  const rim = [];
  for (let ix = 0; ix < N; ix++) rim.push(idx(ix, 0));
  for (let iz = 1; iz < N; iz++) rim.push(idx(N - 1, iz));
  for (let ix = N - 2; ix >= 0; ix--) rim.push(idx(ix, N - 1));
  for (let iz = N - 2; iz >= 1; iz--) rim.push(idx(0, iz));
  rim.push(idx(0, 0));

  const sp = [], suv = [];
  const bottom = -thick;
  for (let k = 0; k < rim.length - 1; k++) {
    const a = rim[k], b = rim[k + 1];
    const ax = cx + pos.getX(a), ay = pos.getY(a) + 0.15, az = cz + pos.getZ(a);
    const bx = cx + pos.getX(b), by = pos.getY(b) + 0.15, bz = cz + pos.getZ(b);
    sp.push(ax, ay, az,  bx, by, bz,  ax, bottom, az,
            bx, by, bz,  bx, bottom, bz,  ax, bottom, az);
    // v = 1 at the surface (topsoil), 0 at the base (bedrock); flipY on the
    // CanvasTexture puts the light end of the gradient at v = 1.
    const ua = k / (rim.length - 1), ub = (k + 1) / (rim.length - 1);
    suv.push(ua, 1,  ub, 1,  ua, 0,
